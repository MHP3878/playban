# Bastion
# Finds clients and mods by three things: the client name the game sends (fabric, forge, lunarclient ...),
# the mod channels a client registers, and a hidden sign with translation keys of mods, which a client
# that has the mod fills in with its own text. Mods that never talk to the server and hide their key
# names cannot be seen by any server plugin.

# en or de
language: en

# Everything here can also be set in the menu: /bastion -> Settings, and per mod /modblock -> click a mod.

# What happens to a player with a blocked mod (unless the mod has its own setting):
#   ALERT   - only tell the team
#   KICK    - kick, the player may come back without the mod
#   WARN    - kick with "remove it, next time you are banned"; after the warnings: ban
#   BAN     - ban right away
#   COMMAND - run the mod's own command (e.g. a ban in your ban plugin)
default-action: WARN

# The reason in kick and ban screens. {mods} (also (mods), [mod] ...) becomes the mod names.
default-reason: "Forbidden mod: {mods}"

# How many times WARN only kicks before it bans
warnings: 1

# How long a ban lasts: e.g. 1h, 1d, 7d, 30d, or perm
ban-duration: 7d

# Who bans: auto = the ban system on the server (StaffCore, LiteBans, AdvancedBan, EssentialsX), else
# the game's own ban list. Then that plugin's ban screen shows and its /unban works. modcheck = Bastion's
# own list (/bastion unban). Old Bastion bans move to the chosen system on start.
ban-system: auto

# Or your own ban command (wins over ban-system). Empty = ban-system decides.
# {player} {duration} {reason} {mods} are filled in. Example: "tempban {player} {duration} {reason}"
ban-command: ""

# Coming back again and again: whoever joins with a blocked mod <times> times within <window>
# gets <action> instead of the normal action. window: off, 10m, 1h, 1d, 7d, 30d.
# action: KICK, BAN 1d, BAN 7d, BAN 30d, BAN perm
repeat:
  window: 1d
  times: 2
  action: BAN 7d
  # also count mods that are set to only tell the team
  count-alerts: false

# Tell the team (permission bastion.notify) when somebody joins with a blocked mod
notify-team: true

# BLOCKLIST: every client except the blocked mods. ALLOWLIST: only the clients below may join at all.
mode: BLOCKLIST
allowed-clients: [vanilla, fabric, forge, neoforge, quilt, lunarclient, feather, badlion, labymod]
# what happens to a client not on the allow list: KICK or BAN
not-allowed-action: KICK

# The hidden sign check on join (opened and closed in the same moment: the player does not see it).
sign-check: true
# A client that blocks the sign check (it changes texts on its own: often a mod that hides mods, but
# also some privacy mods): ALERT (only tell the team), KICK, WARN or BAN
hidden-action: ALERT
# A client that twice does not answer the sign at all (could be a cheat client, could be lag): same choices
no-answer-action: ALERT
# A client that lies about what it is: »vanilla« but mod channels or mod texts, or a fake client name.
# Cheat clients disguise themselves like this. Same choices.
disguise-action: ALERT
# Client names only cheat clients send (regular expressions): LiquidBounce's and ThunderHack's fake Lunar names, CheatBreaker
fake-brands: ['^lunarclient:v2\.21\.33-2612$', '^lunarclient:1\.20\.(4|1)$', '^CB$']

# Code injected into the game from outside (Vape, Prestige and other injection clients), found by
# Lumio 0.6 or newer: KICK ("You have ... on, please delete it"), BAN or ALERT (only tell the team).
# Everything here is also in the menu: /inject
injection-action: KICK
injection:
  # check for it (players with Lumio; in required mode Lumio 0.6 or newer is then needed)
  enabled: true
  # block every injection Lumio is sure about, a known client or not (the action above)
  block-all: true
  # strict: also small signs are enough (a DLL from an odd folder, a tool attached to the game,
  # code from an unknown file). Catches more, but can hit players with unusual setups.
  strict: false
  # known clients with their own action (KICK, BAN, ALERT); the others follow block-all.
  # Known: vape, vapelite, prestige, drip, entropy, doomsday, slinky, karma, sunset, raven, koid, akrien, itami
  clients: {}
  # more program names (without .exe) to look for next to the game, besides those of the known clients
  processes: []

# The check room: on joining, players wait a moment in a closed room of bedrock above (or under) the
# spawn until the check is done; then they are back exactly where they were. /bastion raum sets it up.
check-room:
  enabled: true
  # top: just under the height limit above the spawn; bottom: in the bedrock floor under the spawn
  place: top
  # forbidden mod found: kick (with "please delete it") or stay (in the room, with a window)
  forbidden: kick
  # Lumio missing although required: stay (in the room, with a window: download and guide) or kick
  missing-lumio: stay
  # the longest a check may take before the player goes on anyway (the check goes on in the background)
  max-seconds: 20
  # how long a player may stay in the room with a window before the kick
  stay-minutes: 5

# Lumio, the client mod (Fabric). Players who have it send the list of their mods (from the mod loader
# itself, so mod-hiding filters do not work against it) and get cards with keys instead of chat buttons.
lumio:
  # off, optional (players with Lumio send their list), required (only players with Lumio may play)
  mode: optional
  # where players get Lumio (shown when it is missing or outdated)
  download: ""
  # name shown to Lumio players for this server (optional)
  server-name: ""
  # Lumio players with an older version are told about the update
  latest-version: "0.9.0"
  # in required mode: older versions are refused
  min-version: "0.1.0"
  # in required mode: how long to wait for the mod list after joining
  wait-seconds: 15
  # client names that never need Lumio. Careful: a client name can be faked. Bedrock players via
  # Geyser/Floodgate are found by those plugins and are always free, they need no entry here.
  exempt-brands: []

# Discord webhook for alerts (optional). Empty = off.
discord-webhook: ""

# Blocked mods. Easiest with /modblock <name> and the menu. Per mod: action (DEFAULT = the default above),
# reason, ban-duration, warnings (-1 = default), command (for COMMAND; several separated by ;), notify, discord.
rules:
  meteor:
    display: Meteor Client
    brand: [meteor]
    channel: [meteor]
    keys: [key.meteor-client.open-gui, key.category.meteor-client.meteor-client, "bind:key.meteor-client.open-gui"]
    action: DEFAULT
    reason: ""
    ban-duration: ""
    warnings: -1
    command: ""
    notify: true
    discord: true
  wurst:
    display: Wurst
    brand: [wurst]
    channel: [wurst]
    keys: [key.wurst.zoom, "bind:key.wurst.zoom"]
    action: DEFAULT
    reason: ""
    ban-duration: ""
    warnings: -1
    command: ""
    notify: true
    discord: true
  liquidbounce:
    display: LiquidBounce
    brand: [liquidbounce]
    channel: [liquidbounce]
    keys: []
    action: DEFAULT
    reason: ""
    ban-duration: ""
    warnings: -1
    command: ""
    notify: true
    discord: true
  freecam:
    display: Freecam
    brand: []
    channel: [freecam]
    keys: [key.freecam.toggle, key.category.freecam.controls]
    action: DEFAULT
    reason: ""
    ban-duration: ""
    warnings: -1
    command: ""
    notify: true
    discord: true
  xray:
    display: X-Ray mods
    brand: []
    channel: [xray, advanced-xray]
    keys: [key.xray.toggle, keybinding.category.xray]
    action: DEFAULT
    reason: ""
    ban-duration: ""
    warnings: -1
    command: ""
    notify: true
    discord: true

# ---- Discord and server name, shown on the ban, kick and warning screens
discord: ""
server-name: ""

# ---- How strict Bastion is: /setup 1 (mild), 2 (strict) or 3 (hard). The level sets everything below
# (punishments, anti-cheat, injectors, resource packs, mods); you can still change single things after.
setup:
  level: 0

# ---- The ladder: what the 1st, 2nd, 3rd ... time caught by the anti-cheat means.
# KICK, WARN (kick with a warning) or BAN <time|perm>. /setup fills it in.
punish:
  ladder: [KICK, WARN, WARN, BAN 1d, BAN 7d, BAN 30d, BAN perm]

# ---- The anti-cheat: every finding gives points by how clear it is; whoever reaches the limit is caught
# (an animation, then the next step of the ladder above). Movement that breaks the game's physics is
# put back at once (setback), whatever the points.
anticheat:
  enabled: true
  auto-punish: true
  limit: 25
  # from this many points the player is marked for the team (/bastion ac) and, with auto-watch, watched
  mark-at: 8
  auto-watch: true
  # watched players get this many times the points
  watch-multiplier: 1.5
  # after a big finding (10 points and more): a loud warning and this many seconds before the same check counts again
  grace-seconds: 6
  # one point fades every this many seconds
  fade-seconds: 60
  # caught at once by these, no warning: clear cheats
  instant: [fly, jesus, badpackets, elytra, trident]
  # set the player back to the last place that was in order when a movement breaks the rules
  setback: true
  # hits with too much reach, behind the back or through walls do no damage
  block-hits: true
  # the fall still hurts when no fall damage came
  nofall-damage: true
  # a normal player who gets creative or spectator: false = only tell the team, true = also back to survival
  creative-guard: false
  # blocks per movement step on foot, before effects and ice
  step-speed: 0.75
  # blocks per step while gliding without a rocket
  elytra-speed: 2.6
  # blackhole, mace, lightning, random or none
  animation: random
  # below this TPS and above this ping movement is not judged, so lag never gets anyone punished
  min-tps: 18
  max-ping: 300
  # blocks per second on foot, before effects and ice
  speed-limit: 9.5
  max-cps: 22
  # movement packets per second (timer)
  max-packets: 23
  # x-ray: at least this many diamond ores or ancient debris in 30 minutes, and this share of all mined stone
  xray-ores: 10
  xray-ratio: 0.06
  # more than this many new accounts within 10 seconds: for 2 minutes only known players may join
  bot-joins: 6
  # per check: enabled, and a weight for its points (1.0 = as described)
  checks:
    fly: {enabled: true, weight: 1.0}
    speed: {enabled: true, weight: 1.0}
    reach: {enabled: true, weight: 1.0}
    aura: {enabled: true, weight: 1.0}
    autoclick: {enabled: true, weight: 1.0}
    nofall: {enabled: true, weight: 1.0}
    velocity: {enabled: true, weight: 1.0}
    xray: {enabled: true, weight: 1.0}
    timer: {enabled: true, weight: 1.0}
    step: {enabled: true, weight: 1.0}
    jesus: {enabled: true, weight: 1.0}
    fastbreak: {enabled: true, weight: 1.0}
    nuker: {enabled: true, weight: 1.0}
    scaffold: {enabled: true, weight: 1.0}
    noslow: {enabled: true, weight: 1.0}
    badpackets: {enabled: true, weight: 1.0}
    autototem: {enabled: true, weight: 1.0}
    anchor: {enabled: true, weight: 1.0}
    crystal: {enabled: true, weight: 1.0}
    bot: {enabled: true, weight: 1.0}
    aim: {enabled: true, weight: 1.0}
    criticals: {enabled: true, weight: 1.0}
    invmove: {enabled: true, weight: 1.0}
    fastbow: {enabled: true, weight: 1.0}
    snap: {enabled: true, weight: 1.0}
    botmine: {enabled: true, weight: 1.0}
    xraybait: {enabled: true, weight: 1.0}
    elytra: {enabled: true, weight: 1.0}
    trident: {enabled: true, weight: 1.0}
  # ---- Grim: when the anti-cheat Grim is installed too, its findings count here as well
  grim:
    enabled: true
    # points per Grim violation
    points: 2.0


# ---- Cheat resource packs (x-ray): Lumio 0.10 or newer says which of their own packs players have on,
# and whether one makes stone, deepslate, dirt ... see-through (an x-ray pack). Players without Lumio
# cannot be seen; Paper's anti-x-ray (on from /setup 2) hides the ores from them anyway.
packs:
  enabled: true
  # KICK ("please take the pack out"), BAN or ALERT (only tell the team)
  action: KICK
  # an x-ray pack found by what it does, whatever it is called
  detect-xray: true
  # more names (parts of names) of packs to forbid, besides the known x-ray packs
  blocked: []

# ---- Ranks & rights (/bastion raenge): without a rank plugin, what every player may do in Bastion.
# With StaffCore or LuckPerms the ranks of that plugin are changed instead.
rights:
  groups:
    everybody: []
