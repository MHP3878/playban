default-reason: "Du hast {mods} an. Bitte lösch das."
kick:
  signs: "<yellow><bold>Spuren eines Injectors</bold></yellow>\n\n<white>Lumio hat im Spiel Spuren eines eingeschleusten Programms gefunden:\n<gray>{what}\n\n<white>Starte Minecraft ohne Zusatzprogramme neu und komm wieder."
  forbidden: "<red><bold>Verbotene Mod</bold>\n\n<white>Du hast <red>{mods}</red> an.\n<gray>Bitte lösch das und verbinde dich neu."
  screen: "<red><bold>Gekickt</bold>\n\n<gray>{reason}"
  warn-screen: "<gold><bold>Bitte entfernen</bold>\n\n<gray>{reason}\n\n<white>Entferne die Mod und join neu.\n<red>Verwarnungen bis zum Bann: {left}"
  pack: "<red><bold>Cheat-Resourcepack</bold></red>\n\n<white>Du hast <red>{pack}</red> an.\n<gray>Bitte nimm das Pack raus und komm wieder."
  pack-reason: "Cheat-Resourcepack: {pack}"
ban:
  screen: "<red><bold>Gebannt</bold>\n\n<gray>{reason}\n\n<white>Dauer: {time}"
  forever: "permanent"
  unbanned: "<green><white>{player}</white> ist entbannt."
  not-banned: "<gray><white>{player}</white> ist nicht von Bastion gebannt."

alert:
