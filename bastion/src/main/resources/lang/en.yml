      required: ["", "<green>Every player sends the", "<green>full mod list.", "<gray>Without Lumio: refused."]
      click: "<#4facfe>Click: off → optional → required"
    repeat-window:
      name: "<#4facfe><bold>Coming back: within"
      lore: ["<gray>Now: <white>{value}", "", "<#4facfe>Click to change"]
    repeat-times:
      name: "<#4facfe><bold>Coming back: how often"
      lore: ["<gray>Now: <white>{value} times", "", "<#4facfe>Click to change"]
    repeat-action:
      name: "<#4facfe><bold>Coming back: then"
      lore: ["<gray>Now: <white>{value}", "", "<#4facfe>Click to change"]
    repeat-rule:
      name: "<white><bold>Rule for coming back"
      "on": ["<gray>Whoever joins <white>{times} times</white> within", "<white>{window}</white> <gray>with a blocked mod", "<gray>gets: <red>{punish}"]
      "off": ["<gray>Off. Set a time on the left", "<gray>to switch it on."]
    language:
      name: "<#4facfe><bold>Language"
      lore: ["<gray>Now: <white>{value}", "", "<#4facfe>Click to switch"]
  bans:
    title: "<dark_gray>Banned players ({count})"
    entry: ["<gray>Reason: <white>{reason}", "<gray>Time: <white>{time}", "", "<red>Shift-click to unban"]

