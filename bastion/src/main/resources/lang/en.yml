    mod: "<white><bold>{mod}"
    mod-blocked: "<red>Blocked"
    mod-passed: "<green>Allowed for this player"
    mod-free: "<gray>Not blocked"
    mod-click: "<#4facfe>Click: punish or let pass"
    proof: "<gray>Proof:"
    proof-line: "<dark_gray>- <white>{line}"
    suspicion: "<gold>Suspicious:"
    info: ["<gray>Client: <white>{client}", "<gray>Mod channels: <white>{channels}", "<gray>Warnings: <white>{warnings}", "<gray>Came with a blocked mod recently: <white>{recent}"]
    sign:
      unknown: "<gray>Sign check: <white>not asked yet"
      works: "<green>Sign check: works with this client"
      blocked: "<red>Sign check: this client does not fill in texts"
      no-answer: "<gold>Sign check: no answer from the client"
      impossible: "<gray>Sign check: not possible here (no solid ground)"
      filtered: "<red>Sign check: a filter hides mods"
    recheck:
      name: "<#4facfe>Check again"
      lore: ["<gray>Client name, channels and the", "<gray>hidden sign, also for well-known", "<gray>everyday mods (Sodium, Iris ...).", "<gray>The result shows after a few seconds."]
    none:
      clean: "<green>No mods found"
      hidden: "<gray>Mods unknown"
  decide:
    title: "<dark_gray>{player}: {mod}"
    blocked: ["<red>Blocked", "", "<gray>Punish does: <white>{action}", "<gray>Reason: <white>{reason}", "<gray>Ban length: <white>{duration}"]
    not-blocked: ["<gray>Not blocked. Punish uses the defaults:", "<gray>Action: <white>{action}", "<gray>Reason: <white>{reason}", "<gray>Ban length: <white>{duration}"]
    punish:
      name: "<red><bold>Punish"
      lore: ["<gray>Does what is set: <white>{action}", "<gray>Reason: <white>{reason}"]
    pass:
      name: "<green><bold>Let pass"
      lore: ["<gray>This player may keep the mod.", "<gray>They are not checked for it any more."]
    block:
      name: "<#4facfe><bold>Block for everybody"
      lore: ["<gray>Puts the mod on the block list."]
    settings:
      name: "<#4facfe><bold>Settings of this mod"
      lore: ["<gray>Action, reason, ban length ..."]
  blocked:
    title: "<dark_gray>Blocked mods ({count})"
