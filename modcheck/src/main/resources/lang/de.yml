no-permission: "<red>Das darfst du nicht."
no-permission-commands: "<red>Konsolen-Befehle darf nur ein Admin setzen (Recht <white>modcheck.commands</white>)."
reloaded: "<green>ModCheck neu geladen."
not-found: "<red><white>{player}</white> ist nicht online oder unbekannt."

action:
  alert: "nur das Team informieren"
  kick: "kicken"
  warn: "verwarnen (kicken), dann bannen"
  ban: "bannen"
  command: "Befehl ausführen"
mode:
  blocklist: "Sperrliste (alles außer gesperrten Mods)"
  allowlist: "Erlaubt-Liste (nur erlaubte Clients)"

input:
  download: "<#4facfe>Schreib den Download-Link für Lumio (mit https://)."
  bad-link: "<red>Das ist kein gültiger Link. Er muss mit <white>https://</white> anfangen."
  cancel-hint: "<dark_gray>Schreib <white>abbrechen</white>, um abzubrechen."
  reason: "<#4facfe>Schreib den Grund. <white>{mods}</white> wird zu den Mod-Namen, z. B. <white>Kein Cheaten mit {mods}!</white>"
  command: "<#4facfe>Schreib den Befehl ohne /. <white>{player} {reason} {duration} {mods}</white> werden eingesetzt, mehrere mit <white>;</white> trennen"
  mod: "<#4facfe>Schreib den Namen der Mod, z. B. <white>freecam</white> oder <white>beelocator-21.11.jar</white>."
  ban-command: "<#4facfe>Schreib den Befehl deines Bann-Plugins ohne /, z. B. <white>tempban {player} {duration} {reason}</white>"
  webhook: "<#4facfe>Füge den Discord-Webhook-Link ein (https://discord.com/api/webhooks/...)."
  webhook-wrong: "<red>Das ist kein Discord-Webhook-Link. Er muss mit <white>https://discord.com/api/webhooks/</white> anfangen."

default-reason: "Du hast {mods} an. Bitte lösch das."
kick:
  forbidden: "<red><bold>Verbotene Mod</bold>\n\n<white>Du hast <red>{mods}</red> an.\n<gray>Bitte lösch das und verbinde dich neu."
  screen: "<red><bold>Gekickt</bold>\n\n<gray>{reason}"
  warn-screen: "<gold><bold>Bitte entfernen</bold>\n\n<gray>{reason}\n\n<white>Entferne die Mod und join neu.\n<red>Verwarnungen bis zum Bann: {left}"
ban:
  screen: "<red><bold>Gebannt</bold>\n\n<gray>{reason}\n\n<white>Dauer: {time}"
  forever: "permanent"
  unbanned: "<green><white>{player}</white> ist entbannt."
  not-banned: "<gray><white>{player}</white> ist nicht von ModCheck gebannt."

alert:
  hints: "<yellow>⚠</yellow> <white>{player}</white> <gray>hat {count} Auffälligkeit(en) im Spiel, nur zur Info. <#4facfe>Maus drauf: Details"
  mod: "<red>⚠ <white>{player}</white> <gray>hat <white>{mods}</white> → {action}. <dark_gray>Klick zum Prüfen"
  client: "<red>⚠ <white>{player}</white> <gray>nutzt den Client <white>{mods}</white>, nicht erlaubt → {action}."
lumio:
  kick-silent: "<white><bold>Lumio antwortet nicht mehr</bold>\n\n<gray>Lumio wurde abgeschaltet oder blockiert.\n<gray>Starte Minecraft neu und verbinde dich wieder."
  kick-missing: "<white><bold>Lumio wird benötigt</bold>\n\n<gray>Auf diesem Server spielst du mit dem Lumio-Client.\n<gray>Er ist kostenlos und macht das Spiel schöner.\n\n<white>{download}"
  kick-no-report: "<white><bold>Lumio hat nicht geantwortet</bold>\n\n<gray>Bitte verbinde dich neu. Hilft das nicht, aktualisiere Lumio:\n<white>{download}"
  kick-outdated: "<white><bold>Bitte Lumio aktualisieren</bold>\n\n<gray>Dieser Server braucht Lumio <white>{min}</white> oder neuer.\n\n<white>{download}"
  ask-team: "Frag das Team nach dem Download-Link."
  line: "<gray>Lumio <white>{version}</white> · Minecraft <white>{minecraft}</white> · <white>{count}</white> Mods gemeldet"
  none: "<gray>Kein Lumio <dark_gray>(Mod-Liste unvollständig: nur Client-Name, Kanäle und Schild)"
  usage: "<gray>Benutzung: <white>/modcheck lumio [aus|freiwillig|pflicht]</white>"
  status: "<gray>Lumio: <white>{mode}</white>"
  mode-name:
    "off": "aus"
    optional: "freiwillig"
    required: "Pflicht"
  explain-off: "<gray>Lumio ist aus. ModCheck prüft nur Client-Name, Mod-Kanäle und das versteckte Schild."
  explain-optional: "<gray>Lumio ist freiwillig. Wer es hat, schickt seine komplette Mod-Liste; alle anderen werden nur über Client-Name, Kanäle und Schild geprüft."
  explain-required: "<gray>Lumio ist Pflicht. Nur Spieler mit Lumio können spielen, und von allen kommt die komplette Mod-Liste."
  warn-incomplete: "<gold>⚠ <gray>Ohne Lumio-Pflicht kennt ModCheck <white>nicht alle Mods</white>. Unsichtbar bleiben Mods ohne Texte (z. B. Lithium, Baritone), Wurst und LiquidBounce, und Clients, die sich als Vanilla tarnen (z. B. OpSec). Sicher ist nur: <white>/modcheck lumio pflicht</white>"
  warn-required: "<gold>⚠ <gray>Spieler ohne Lumio werden ab ihrem nächsten Joinen abgewiesen (Bedrock-Spieler und modcheck.bypass ausgenommen). Gerade online ohne Lumio: <white>{count}</white>"
  warn-no-download: "<gold>⚠ <gray>Trag noch einen Download-Link ein (<white>lumio.download</white> in der config.yml), sonst wissen Spieler nicht, wo es Lumio gibt."

proof:
  title: "<white><bold>Beweis</bold>"
  click: "<dark_gray>Klick: Spieler prüfen"
  brand: "Client-Name »{brand}«"
  channel: "Mod-Kanal {channel}"
  sign: "Schild: »{answer}« für {key}"
  bind: "Schild: Taste »{answer}« für {key}"
  sign-raw: "Schild: versteckt ihren Text, gibt aber den Namen {key} zurück"
  canary: "Kanal {channel} zeigt {mod}, aber dessen Text {key} kam leer zurück: ein Filter versteckt Mods"
  vanilla-channel: "Nennt sich »vanilla«, hat aber den Mod-Kanal {channel}"
  vanilla-text: "Nennt sich »vanilla«, hat aber {mod} (Schild)"
  fake-brand: "Gefälschte Client-Kennung »{brand}« (so tarnen sich Cheat-Clients)"
  lunar: "Nennt sich Lunar Client, hat aber keine Lunar-Kanäle"
  feather: "Nennt sich Feather, hat aber keine Feather-Kanäle"
