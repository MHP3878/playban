  altered: "Ein ausgedachter Text kam verändert zurück: der Client verändert Texte selbst"
  missing: "Die Kontrollen auf dem Schild kamen nicht vollständig zurück"
  no-answer: "Hat zweimal nicht auf das Schild geantwortet"
  lumio: "Lumio-Bericht: {name} {version} ({id})"
  lumio-missing: "{mod} ({how}) fehlt im Lumio-Bericht: der Bericht ist gefälscht"
  how-sign: "auf dem Schild gesehen"
  how-channel: "Kanal {channel}"
suspicious:
  blocked: "Schutz gegen die Mod-Prüfung"
  no-answer: "keine Antwort auf die Mod-Prüfung"
  filtered: "Filter gegen die Mod-Prüfung"
  disguise: "Tarnung (gibt sich als anderer Client aus)"
  lumio-lie: "gefälschter Lumio-Bericht"
discord:
  line: "⚠ {player} hat {mods} → {action}"

check:
  usage: "<gray>Benutzung: <white>/modcheck [spieler]</white>, <white>/modcheck unban <spieler></white>, <white>/modcheck reset <spieler></white>, <white>/modcheck reload</white>, <white>/modcheck lumio [aus|freiwillig|pflicht]</white>"
  reset: "<gray>Die Verwarnungen von <white>{player}</white> sind gelöscht."
  header: "<white>{player}</white><gray>: Client <white>{client}</white>, Verwarnungen <white>{warnings}</white>"
  mods: "<gray>Mods: <white>{mods}"
  channels: "<gray>Mod-Kanäle: <white>{channels}"
  running: "<gray>Prüfe <white>{player}</white> ..."
  result: "<white><bold>{player}</bold></white><gray>: Client <white>{client}</white>, <white>{count}</white> Mod(s): <white>{mods}"
  result-works: "<green>✔ Prüfung hat geklappt. Was der Client hat, steht da."
  result-blocked: "<red>✘ Dieser Client blockt die Prüfung (Schutz-Mod). Was er sagt, zählt nicht; das Team wurde informiert."
  result-no-answer: "<gold>? Der Client hat zweimal nicht geantwortet (Lag oder ein Client, der die Prüfung ignoriert)."
  result-impossible: "<gold>? Hier keine Prüfung möglich. Auf festen Boden stellen und nochmal."
  result-unknown: "<gray>? Noch nicht geprüft. Ist der Spieler gerade tot, wird nach dem Respawn geprüft."
