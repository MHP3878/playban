prefix: "<gradient:#4facfe:#00f2fe><bold>ModCheck</bold></gradient> <dark_gray>» "
word-on: "on"
word-off: "off"
no-permission: "<red>You may not do that."
no-permission-commands: "<red>Only an admin may set console commands (permission <white>modcheck.commands</white>)."
reloaded: "<green>ModCheck reloaded."
not-found: "<red><white>{player}</white> is not online or unknown."

action:
  alert: "only tell the team"
  kick: "kick"
  warn: "warn (kick), then ban"
  ban: "ban"
  command: "run the command"
mode:
  blocklist: "block list (everything except blocked mods)"
  allowlist: "allow list (only allowed clients)"

input:
  cancel-hint: "<dark_gray>Type <white>cancel</white> to stop."
  reason: "<#4facfe>Type the reason. <white>{mods}</white> becomes the mod names, e.g. <white>No cheating with {mods}!</white>"
  command: "<#4facfe>Type the command, without /. <white>{player} {reason} {duration} {mods}</white> are filled in, several separated by <white>;</white>"
  mod: "<#4facfe>Type the mod's name, e.g. <white>freecam</white> or <white>beelocator-21.11.jar</white>."
  ban-command: "<#4facfe>Type your ban plugin's command, without /, e.g. <white>tempban {player} {duration} {reason}</white>"
  webhook: "<#4facfe>Paste the Discord webhook link (https://discord.com/api/webhooks/...)."
  webhook-wrong: "<red>That is not a Discord webhook link. It must start with <white>https://discord.com/api/webhooks/</white>."

kick:
  screen: "<red><bold>Kicked</bold>\n\n<gray>{reason}"
  warn-screen: "<gold><bold>Please remove it</bold>\n\n<gray>{reason}\n\n<white>Remove the mod and join again.\n<red>Warnings left before a ban: {left}"
ban:
  screen: "<red><bold>Banned</bold>\n\n<gray>{reason}\n\n<white>Time: {time}"
  forever: "permanent"
  unbanned: "<green><white>{player}</white> is unbanned."
  not-banned: "<gray><white>{player}</white> is not banned by ModCheck."

alert:
  mod: "<red>⚠ <white>{player}</white> <gray>has <white>{mods}</white> → {action}. <dark_gray>Click to check"
  client: "<red>⚠ <white>{player}</white> <gray>uses the client <white>{mods}</white>, not on the allow list → {action}."
lumio:
  kick-missing: "<white><bold>Lumio is needed</bold>\n\n<gray>On this server you play with the Lumio client.\n<gray>It is free and makes the game look better.\n\n<white>{download}"
  kick-no-report: "<white><bold>Lumio did not answer</bold>\n\n<gray>Please reconnect. If that does not help, update Lumio:\n<white>{download}"
  kick-outdated: "<white><bold>Please update Lumio</bold>\n\n<gray>This server needs Lumio <white>{min}</white> or newer.\n\n<white>{download}"
  ask-team: "Ask the team for the download link."
  line: "<gray>Lumio <white>{version}</white> · Minecraft <white>{minecraft}</white> · <white>{count}</white> mods reported"
  none: "<gray>No Lumio <dark_gray>(mod list incomplete: only client name, channels and sign)"
  usage: "<gray>Usage: <white>/modcheck lumio [off|optional|required]</white>"
  status: "<gray>Lumio: <white>{mode}</white>"
  mode-name:
    "off": "off"
    optional: "optional"
    required: "required"
  explain-off: "<gray>Lumio is off. ModCheck only checks the client name, mod channels and the hidden sign."
  explain-optional: "<gray>Lumio is optional. Players who have it send their full mod list; everyone else is only checked by client name, channels and sign."
  explain-required: "<gray>Lumio is required. Only players with Lumio can play, and the full mod list comes from everyone."
  warn-incomplete: "<gold>⚠ <gray>Without Lumio being required, ModCheck does <white>not know every mod</white>. Mods without texts (e.g. Lithium, Baritone), Wurst and LiquidBounce, and clients that pretend to be vanilla (e.g. OpSec) stay invisible. Only safe: <white>/modcheck lumio required</white>"
  warn-required: "<gold>⚠ <gray>Players without Lumio are refused from their next join (Bedrock players and modcheck.bypass excepted). Online without Lumio right now: <white>{count}</white>"
  warn-no-download: "<gold>⚠ <gray>Add a download link (<white>lumio.download</white> in config.yml), or players do not know where to get Lumio."

proof:
  title: "<white><bold>Proof</bold>"
  click: "<dark_gray>Click: check the player"
  brand: "client name »{brand}«"
  channel: "mod channel {channel}"
  sign: "sign: »{answer}« for {key}"
  bind: "sign: key »{answer}« for {key}"
  sign-raw: "sign: hides its text but gives back the name {key}"
  canary: "channel {channel} shows {mod}, but its text {key} came back empty: a filter hides mods"
  vanilla-channel: "calls itself »vanilla« but has the mod channel {channel}"
  vanilla-text: "calls itself »vanilla« but has {mod} (sign)"
  fake-brand: "fake client name »{brand}« (how cheat clients disguise themselves)"
  lunar: "calls itself Lunar Client but has no Lunar channels"
  feather: "calls itself Feather but has no Feather channels"
  blank: "a text every client knows came back empty: texts are not filled in"
  altered: "a made-up text came back changed: the client changes texts on its own"
  missing: "the controls on the sign did not all come back"
  no-answer: "did not answer the sign twice"
  lumio: "Lumio report: {name} {version} ({id})"
  lumio-missing: "{mod} ({how}) is missing in the Lumio report: the report is forged"
  how-sign: "seen on the sign"
  how-channel: "channel {channel}"
suspicious:
  blocked: "protection against the mod check"
  no-answer: "no answer to the mod check"
  filtered: "filter against the mod check"
  disguise: "disguise (pretends to be another client)"
  lumio-lie: "forged Lumio report"
discord:
  line: "⚠ {player} has {mods} → {action}"

check:
  usage: "<gray>Usage: <white>/modcheck [player]</white>, <white>/modcheck unban <player></white>, <white>/modcheck reset <player></white>, <white>/modcheck reload</white>, <white>/modcheck lumio [off|optional|required]</white>"
  reset: "<gray>The warnings of <white>{player}</white> are cleared."
  header: "<white>{player}</white><gray>: client <white>{client}</white>, warnings <white>{warnings}</white>"
  mods: "<gray>Mods: <white>{mods}"
  channels: "<gray>Mod channels: <white>{channels}"
  running: "<gray>Checking <white>{player}</white> ..."
  result: "<white><bold>{player}</bold></white><gray>: client <white>{client}</white>, <white>{count}</white> mod(s): <white>{mods}"
  result-works: "<green>✔ Check worked. What the client has is listed."
  result-blocked: "<red>✘ This client blocks the check (a mod that hides mods). Nothing it says counts; the team was told."
  result-no-answer: "<gold>? The client did not answer twice (lag, or a client that ignores the check)."
  result-impossible: "<gold>? No check possible here. Stand on solid ground and try again."
  result-unknown: "<gray>? Not checked yet. If the player is dead, the check runs after the respawn."
  proof: "<dark_gray>  • <white>{mod}</white><gray>: {proof}"
  suspicion: "<gold>  ⚠ <gray>{line}"
  result-filtered: "<red>✘ A filter hides mods (e.g. ExploitPreventer). Found by the cross-check; the team was told."

block:
  usage: "<gray>Usage: <white>/modblock <mod name></white>, e.g. <white>/modblock freecam</white>"
  usage-unblock: "<gray>Usage: <white>/modunblock <mod name></white>"
  did-you-mean: "<gray>No known mod called <white>{mod}</white>. Did you mean:"
  suggestion: "<#4facfe>  ▶ {mod} <dark_gray>({id}) <gray>click to block"
  as-typed: "<gray>  ▶ Block it as <white>{mod}</white> anyway <dark_gray>(click)"
  done: "<green><white>{mod}</white> is blocked: <white>{action}</white>. Everybody online was checked."
  done-unknown: "<green><white>{mod}</white> is blocked: <white>{action}</white>. <gray>Not a known mod: it is found if it registers a channel or answers the sign check under this name."
  unblocked: "<gray><white>{mod}</white> is allowed again."
  not-blocked: "<gray><white>{mod}</white> is not blocked."

decide:
  punished: "<red><white>{player}</white> was punished for <white>{mod}</white>: {action}."
  passed: "<green><white>{player}</white> may keep <white>{mod}</white>."

menu:
  previous:
    name: "<white>Previous page"
    lore: []
  next:
    name: "<white>Next page"
    lore: []
  back:
    name: "<gray>Back"
    lore: []
  main:
    title: "<dark_gray>ModCheck"
    players:
      name: "<#4facfe><bold>Check players"
      lore: ["<gray>{count} online. Click a player to", "<gray>see their client and mods.", "", "<#4facfe>Click to open"]
    blocked:
      name: "<#4facfe><bold>Blocked mods"
      lore: ["<gray>{count} blocked. Click a mod to", "<gray>set what happens.", "", "<#4facfe>Click to open"]
    add:
      name: "<green><bold>Block a mod"
      lore: ["<gray>Just type its name.", "<gray>Versions and .jar do not matter."]
    suggestions:
      name: "<#4facfe><bold>Suggestions"
      lore: ["<gray>Known mods and cheat clients", "<gray>that are not blocked yet."]
    settings:
      name: "<#4facfe><bold>Settings"
      lore: ["<gray>Default action, reason, ban length,", "<gray>warnings, allow list, Discord ..."]
    bans:
      name: "<#4facfe><bold>Banned players"
      lore: ["<gray>{count} banned by ModCheck.", "", "<#4facfe>Click to open"]
  players:
    title: "<dark_gray>Players"
    name: "<white><bold>{player}"
    lore: ["<gray>Client: <white>{client}", "<gray>Mods found: <white>{mods}", "", "<#4facfe>Click to check"]
    blocked: "<red>{count} blocked mod(s)!"
  player:
    title: "<dark_gray>Mods of {player}"
    mod: "<white><bold>{mod}"
    mod-blocked: "<red>Blocked"
    mod-passed: "<green>Allowed for this player"
    mod-free: "<gray>Not blocked"
    mod-click: "<#4facfe>Click: punish or let pass"
    proof: "<gray>Proof:"
    proof-line: "<dark_gray>- <white>{line}"
    suspicion: "<gold>Suspicious:"
    info: ["<gray>Client: <white>{client}", "<gray>Mod channels: <white>{channels}", "<gray>Warnings: <white>{warnings}", "<gray>Came with a blocked mod recently: <white>{recent}"]
    sign:
      unknown: "<gray>Sign check: <white>not asked yet"
      works: "<green>Sign check: works with this client"
      blocked: "<red>Sign check: this client does not fill in texts"
      no-answer: "<gold>Sign check: no answer from the client"
      impossible: "<gray>Sign check: not possible here (no solid ground)"
      filtered: "<red>Sign check: a filter hides mods"
    recheck:
      name: "<#4facfe>Check again"
      lore: ["<gray>Client name, channels and the", "<gray>hidden sign, also for well-known", "<gray>everyday mods (Sodium, Iris ...).", "<gray>The result shows after a few seconds."]
    none:
      clean: "<green>No mods found"
      hidden: "<gray>Mods unknown"
  decide:
    title: "<dark_gray>{player}: {mod}"
    blocked: ["<red>Blocked", "", "<gray>Punish does: <white>{action}", "<gray>Reason: <white>{reason}", "<gray>Ban length: <white>{duration}"]
    not-blocked: ["<gray>Not blocked. Punish uses the defaults:", "<gray>Action: <white>{action}", "<gray>Reason: <white>{reason}", "<gray>Ban length: <white>{duration}"]
    punish:
      name: "<red><bold>Punish"
      lore: ["<gray>Does what is set: <white>{action}", "<gray>Reason: <white>{reason}"]
    pass:
      name: "<green><bold>Let pass"
      lore: ["<gray>This player may keep the mod.", "<gray>They are not checked for it any more."]
    block:
      name: "<#4facfe><bold>Block for everybody"
      lore: ["<gray>Puts the mod on the block list."]
    settings:
      name: "<#4facfe><bold>Settings of this mod"
      lore: ["<gray>Action, reason, ban length ..."]
  blocked:
    title: "<dark_gray>Blocked mods ({count})"
    entry: ["<gray>Action: <white>{action}", "<gray>Reason: <white>{reason}", "", "<#4facfe>Click: settings"]
  rule:
    title: "<dark_gray>Settings: {mod}"
    default: "default"
    what: ["<gray>What happens when somebody", "<gray>joins with this mod, or a", "<gray>moderator presses Punish."]
    action:
      name: "<#4facfe><bold>Action"
      lore: ["<gray>Now: <white>{value}", "", "<#4facfe>Click to change"]
    reason:
      name: "<#4facfe><bold>Reason"
      lore: ["<gray>Now: <white>{value}", "<gray>{mods} becomes the mod name.", "", "<#4facfe>Click: type a new one", "<red>Shift-click: back to the default"]
    duration:
      name: "<#4facfe><bold>Ban length"
      lore: ["<gray>Now: <white>{value}", "<gray>For ban, and warn after the warnings.", "", "<#4facfe>Click to change"]
    warnings:
      name: "<#4facfe><bold>Warnings before a ban"
      lore: ["<gray>Now: <white>{value}", "<gray>How often warn only kicks.", "", "<#4facfe>Click to change"]
    command:
      name: "<#4facfe><bold>Own command"
      lore: ["<gray>Now: <white>{value}", "<gray>e.g. tempban {player} 3d {reason}", "", "<#4facfe>Click: type it (sets the action)", "<red>Shift-click: remove"]
    notify:
      name: "<#4facfe><bold>Tell the team"
      lore: ["<gray>Now: <white>{value}", "", "<#4facfe>Click to switch"]
    discord:
      name: "<#4facfe><bold>Discord"
      lore: ["<gray>Now: <white>{value}", "<gray>Needs a webhook in the settings.", "", "<#4facfe>Click to switch"]
    preview:
      name: "<white>What the player reads"
      lore: ["<gray>{reason}"]
    unblock:
      name: "<red><bold>Allow again"
      lore: ["<red>Shift-click to remove the block"]
  suggestions:
    title: "<dark_gray>Known mods"
    client: ["<red>Cheat client", "", "<#4facfe>Click to block"]
    mod: ["<gray>Mod", "", "<#4facfe>Click to block"]
  settings:
    title: "<dark_gray>Settings"
    own-ban: "ModCheck's own ban"
    action:
      name: "<#4facfe><bold>Default action"
      lore: ["<gray>Now: <white>{value}", "<gray>For mods without their own.", "", "<#4facfe>Click to change"]
    reason:
      name: "<#4facfe><bold>Default reason"
      lore: ["<gray>Now: <white>{value}", "<gray>{mods} becomes the mod names.", "", "<#4facfe>Click: type a new one"]
    duration:
      name: "<#4facfe><bold>Default ban length"
      lore: ["<gray>Now: <white>{value}", "", "<#4facfe>Click to change"]
    warnings:
      name: "<#4facfe><bold>Warnings before a ban"
      lore: ["<gray>Now: <white>{value}", "", "<#4facfe>Click to change"]
    ban-command:
      name: "<#4facfe><bold>Ban with"
      lore: ["<gray>Now: <white>{value}", "<gray>Your ban plugin's command, or", "<gray>ModCheck's own ban.", "", "<#4facfe>Click: type a command", "<red>Shift-click: own ban"]
    notify:
      name: "<#4facfe><bold>Tell the team"
      lore: ["<gray>Now: <white>{value}", "", "<#4facfe>Click to switch"]
    discord:
      name: "<#4facfe><bold>Discord webhook"
      lore: ["<gray>Now: <white>{value}", "", "<#4facfe>Click: paste a link", "<red>Shift-click: off"]
    mode:
      name: "<#4facfe><bold>Mode"
      lore: ["<gray>Now: <white>{value}", "<gray>Allowed clients: <white>{clients}", "", "<#4facfe>Click to switch"]
    not-allowed:
      name: "<#4facfe><bold>Client not allowed"
      lore: ["<gray>Now: <white>{value}", "<gray>Only in allow-list mode.", "", "<#4facfe>Click to change"]
    sign:
      name: "<#4facfe><bold>Hidden sign check"
      lore: ["<gray>Now: <white>{value}", "<gray>Asks the client for mod texts;", "<gray>invisible to the player.", "", "<#4facfe>Click to switch"]
    hidden:
      name: "<#4facfe><bold>Check blocked"
      lore: ["<gray>Now: <white>{value}", "<gray>When a client blocks the sign", "<gray>check (a mod that hides mods).", "<gray>Harmless privacy mods can do", "<gray>it too: alert is the safest.", "", "<#4facfe>Click to change"]
    no-answer:
      name: "<#4facfe><bold>No answer"
      lore: ["<gray>Now: <white>{value}", "<gray>When a client twice does not", "<gray>answer the sign at all", "<gray>(cheat client or heavy lag).", "", "<#4facfe>Click to change"]
    disguise:
      name: "<#4facfe><bold>Disguise"
      lore: ["<gray>Now: <white>{value}", "<gray>When a client lies about what", "<gray>it is: »vanilla« with mod channels", "<gray>or mod texts; a fake Lunar name.", "", "<#4facfe>Click to change"]
    lumio:
      name: "<#4facfe><bold>Lumio required"
      lore: ["<gray>Now: <white>{value}", "<gray>Lumio sends the full mod", "<gray>list from the mod loader."]
      incomplete: ["", "<gold>⚠ Not required: ModCheck does", "<gold>not know every mod: mods without", "<gold>texts, Wurst and disguised", "<gold>clients stay invisible."]
      required: ["", "<green>Every player sends the", "<green>full mod list.", "<gray>Without Lumio: refused."]
      click: "<#4facfe>Click: off → optional → required"
    repeat-window:
      name: "<#4facfe><bold>Coming back: within"
      lore: ["<gray>Now: <white>{value}", "", "<#4facfe>Click to change"]
    repeat-times:
      name: "<#4facfe><bold>Coming back: how often"
      lore: ["<gray>Now: <white>{value} times", "", "<#4facfe>Click to change"]
    repeat-action:
      name: "<#4facfe><bold>Coming back: then"
      lore: ["<gray>Now: <white>{value}", "", "<#4facfe>Click to change"]
    repeat-rule:
      name: "<white><bold>Rule for coming back"
      "on": ["<gray>Whoever joins <white>{times} times</white> within", "<white>{window}</white> <gray>with a blocked mod", "<gray>gets: <red>{punish}"]
      "off": ["<gray>Off. Set a time on the left", "<gray>to switch it on."]
    language:
      name: "<#4facfe><bold>Language"
      lore: ["<gray>Now: <white>{value}", "", "<#4facfe>Click to switch"]
  bans:
    title: "<dark_gray>Banned players ({count})"
    entry: ["<gray>Reason: <white>{reason}", "<gray>Time: <white>{time}", "", "<red>Shift-click to unban"]

repeat:
  suffix: "(again within a short time)"
  alert-action: "came back again with it → {action}"
  ban: "ban {time}"
  window:
    "off": "off"
    10m: "10 minutes"
    1h: "1 hour"
    1d: "1 day"
    7d: "7 days"
    30d: "30 days"
