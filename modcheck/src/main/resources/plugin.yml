name: ModCheck
version: '${project.version}'
main: dev.modcheck.ModCheckPlugin
api-version: '1.21'
description: See which client and mods players use, and block mods by name - kick, warn or ban on join.

commands:
  modcheck:
    description: Which client and mods a player has
    aliases: [modscheck, mods]
    permission: modcheck.check
  modblock:
    description: Forbid a mod just by its name
    aliases: [modsperre, blockmod]
    permission: modcheck.block
  modunblock:
    description: Allow a mod again
    aliases: [modentsperren, unblockmod]
    permission: modcheck.block
  inject:
    description: Block injection clients (Vape, Prestige ...), one by one or all
    aliases: [injects, injectblock]
    permission: modcheck.block
  mcroom:
    description: The buttons of the check room window (leave, guide)

permissions:
  modcheck.admin:
    description: Everything in ModCheck
    default: op
    children:
      modcheck.check: true
      modcheck.block: true
      modcheck.notify: true
      modcheck.unban: true
      modcheck.reload: true
      modcheck.settings: true
      modcheck.commands: true
  modcheck.check:
    description: "/modcheck - see a player's client and mods"
    default: op
  modcheck.block:
    description: "/modblock, /modunblock and /inject"
    default: op
  modcheck.notify:
    description: Is told when somebody joins with a blocked mod
    default: op
  modcheck.unban:
    description: "/modcheck unban <player> and /modcheck reset <player>"
    default: op
  modcheck.reload:
    description: "/modcheck reload"
    default: op
  modcheck.settings:
    description: General settings (default punishment, mode, Discord ...)
    default: op
  modcheck.commands:
    description: Set console commands (ban command, command per mod); this is server-wide power
    default: op
  modcheck.bypass:
    description: Never checked
    default: false
