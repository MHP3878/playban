# PlayBan - everything in this file can also be changed in-game with /playban menu

# Language of all texts. Bundled: en, de. Files are in the lang/ folder.
language: en

# true  = the punishment only runs down while the player is online (they have to play it off)
# false = the punishment runs down in real time, like a normal temporary ban
count-only-online-time: true

# Staff with the permission playban.see can still see punished players
staff-see-punished: true

# true = nice messages and apologies are delivered without a staff review (not recommended)
auto-approve-messages: false

# What a punished player is NOT allowed to do
restrictions:
  hide-from-players: true
  block-break: true
  block-place: true
  interact: true
  damage: true
  invulnerable: true
  item-drop: true
  item-pickup: true
  chat: true
  commands: true
  mob-target: true

# Commands a punished player may still use (without the slash).
# /playban and /ticket always work.
allowed-commands:
  - rules
  - help
  - spawn

# Quick-select buttons in the punish menu
duration-presets: [30m, 1h, 6h, 1d, 3d, 7d]
reason-presets:
  - Griefing
  - Insulting
  - Spam
  - Cheating
  - Scamming

# What a banned player sees.
ban-screen:
  # Invite link to your Discord, shown on the ban screen and to spectator-banned players. Empty = not shown.
  discord: ""
  # Your own lines for the ban screen (MiniMessage colors). Empty = the default text from the language file.
  # Placeholders: {reason} {time} {staff} {discord}
  lines: []

# Spectator ban: the player may join but is stuck in spectator mode and can only write tickets.
limbo:
  # The player sees almost nothing (blindness)
  blind: true
  # The player sees no other players
  hide-others: true
  # Where the player is held. Set it in the menu; without it the world spawn is used.
  # location: {world: world, x: 0, y: 100, z: 0, yaw: 0, pitch: 0}

# ---- Tickets ----
# What players can pick when they open a ticket. Editable in the menu.
ticket-reasons:
  report:
    name: "Report a player"
    icon: PLAYER_HEAD
  question:
    name: "Question"
    icon: BOOK
  bug:
    name: "Bug"
    icon: SPIDER_EYE
  appeal:
    name: "Appeal a punishment"
    icon: PAPER
  voice:
    name: "Voice chat"
    icon: JUKEBOX
  other:
    name: "Other"
    icon: OAK_SIGN

# One-click answers for the team
quick-replies:
  - "Thanks for your ticket, we are looking into it."
  - "Please describe what happened in a bit more detail."
  - "Do you have a screenshot or a video?"
  - "We have dealt with it. Thank you for reporting."

# Remind the team about tickets nobody picked up after this many minutes. 0 = never
ticket-reminder-minutes: 10

# Discord webhook URL: new tickets are posted there. Empty = off
discord-webhook: ""

# ---- Voice chat (only with the plugin "Simple Voice Chat") ----
# What players can pick when they report a voice group with /voice report
voice-report-reasons:
  - "Inappropriate group name"
  - "Insults or inappropriate talk"
  - "Harassment"
  - "Other"
