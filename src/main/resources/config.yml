# StaffCore - everything in this file can also be changed in-game with /sc menu

# Language of all texts. Bundled: en, de. Files are in the lang/ folder.
language: en

# true  = the punishment only runs down while the player is online (they have to play it off)
# false = the punishment runs down in real time, like a normal temporary ban
count-only-online-time: true

# Staff with the permission staffcore.see can still see punished players
staff-see-punished: true

# true = nice messages and apologies are delivered without a staff review (not recommended)
auto-approve-messages: false

# true = /ban, /tempban, /punish, /warn, /unban and /vanish work without "/sc" in front.
# false = they are not registered at all, so another plugin (EssentialsX, LiteBans, ...) can use the names.
# Takes effect after a restart.
short-commands: true

# What happens to the inventory of a punished player:
#   KEEP  = they keep everything (but cannot use it while punished)
#   STORE = it is taken away and given back when the punishment ends
#   CLEAR = it is deleted for good
inventory-mode: KEEP

# What a punished player is NOT allowed to do
restrictions:
  hide-from-players: true
  block-break: true
  block-place: true
  interact: true
  damage: true
  invulnerable: true
  item-drop: true
  item-pickup: true
  chat: true
  commands: true
  mob-target: true
  # adventure mode: the game itself stops breaking blocks, so nothing jumps back and it does not feel laggy
  adventure-mode: true
  # line above the hotbar with time left and reason
  action-bar: true
  # punished players walk slower
  slow: false
  slow-level: 1

# Commands a punished player may still use (without the slash).
# /playban and /ticket always work.
allowed-commands:
  - rules
  - help
  - spawn

# Quick-select buttons in the punish menu
duration-presets: [30m, 1h, 6h, 1d, 3d, 7d]
reason-presets:
  - Griefing
  - Insulting
  - Spam
  - Cheating
  - Scamming

# What a banned player sees.
ban-screen:
  # Invite link to your Discord, shown on the ban screen and to spectator-banned players. Empty = not shown.
  discord: ""
  # Your own lines for the ban screen (MiniMessage colors). Empty = the default text from the language file.
  # Placeholders: {reason} {time} {staff} {discord}
  lines: []

# Spectator ban: the player may join but is stuck in spectator mode and can only write tickets.
limbo:
  # The player sees almost nothing (blindness)
  blind: true
  # The player sees no other players
  hide-others: true
  # The player cannot even turn their head
  lock-view: true
  # Where the player is held. Set it in the menu; without it the world spawn is used.
  # location: {world: world, x: 0, y: 100, z: 0, yaw: 0, pitch: 0}

# ---- Tickets ----
# What players can pick when they open a ticket. Editable in the menu.
ticket-reasons:
  report:
    name: "Report a player"
    icon: PLAYER_HEAD
  question:
    name: "Question"
    icon: BOOK
  bug:
    name: "Bug"
    icon: SPIDER_EYE
  appeal:
    name: "Appeal a punishment"
    icon: PAPER
  voice:
    name: "Voice chat"
    icon: JUKEBOX
  other:
    name: "Other"
    icon: OAK_SIGN

# One-click answers for the team
quick-replies:
  - "Thanks for your ticket, we are looking into it."
  - "Please describe what happened in a bit more detail."
  - "Do you have a screenshot or a video?"
  - "We have dealt with it. Thank you for reporting."

# Remind the team about tickets nobody picked up after this many minutes. 0 = never
ticket-reminder-minutes: 10

# Seconds a player has to wait between two tickets (the team is not limited). 0 = no limit
ticket-cooldown-seconds: 60

# Wrong answers allowed in the rules quiz before the task is lost
quiz-attempts: 3

# Discord webhook URL: new tickets are posted there. Empty = off
discord-webhook: ""

# ---- Voice chat (only with the plugin "Simple Voice Chat") ----
# What players can pick when they report a voice group with /voice report
voice-report-reasons:
  - "Inappropriate group name"
  - "Insults or inappropriate talk"
  - "Harassment"
  - "Other"

# ---- Vanish (/vanish) ----
vanish:
  # Chat messages of vanished staff only go to the team. Start a message with ! to write publicly.
  staff-chat-only: true
  # Vanished staff pick up items from the ground
  allow-pickup: false
  # Filled by /vanish, so you stay invisible after a rejoin or restart
  players: []

# ---- Hidden commands ----
# Players without staffcore.commands.all do not see these commands and get "unknown command" if they type them.
command-hiding:
  enabled: true
  # Also hide forms like bukkit:plugins or minecraft:tp, which people use to get around blocks
  hide-namespaced: true
  hidden: [plugins, pl, version, ver, about, icanhasbukkit, "?"]

# ---- Spawn (/spawn, /setspawn) ----
# Switch off if another plugin (for example EssentialsX) already handles /spawn. Takes effect after a restart.
# Joining and respawning at spawn only happen once a spawn was set with /setspawn.
spawn:
  enabled: true
  # NEVER, FIRST_JOIN (new players only) or ALWAYS
  on-join: FIRST_JOIN
  # after death, players without a bed or respawn anchor come back at spawn
  on-death: true
  # seconds to stand still before /spawn teleports. Moving or taking damage cancels it. 0 = at once
  warmup: 3
  # seconds between two uses of /spawn. 0 = no limit
  cooldown: 0
  # set with /setspawn or in the menu; without it the world spawn is used
  # location: {world: world, x: 0, y: 64, z: 0, yaw: 0, pitch: 0}

# ---- Admin commands ----
# /tpadmin, /tphere, /tpback, /freeze, /unfreeze, /invsee, /endersee, /teamchat, /clearchat, /fly, /heal, /god.
# false = not registered at all, so another plugin can use these names. Takes effect after a restart.
admin-commands: true

# ---- Block log (/blocklog, also /log and /bl) ----
# Records who broke, placed or blew up blocks and who took what out of chests.
block-log:
  enabled: true
  # entries older than this are deleted on start
  keep-days: 30
  # largest radius for lookups, rollbacks and replays
  max-radius: 100

# ---- Staff mode (/staffmode) ----
staff-mode:
  # reason for warnings given with the warn stick. Empty = the text from the language file
  warn-reason: ""

# ---- Mute and lockdown ----
# Commands a muted player cannot use, so the mute cannot be dodged
mute-blocked-commands: [msg, tell, w, whisper, r, reply, me, say, mail, m, t, pm, dm]
lockdown:
  # /lockdown switches this. While on, only ops, the team (from min-level) and protected players can join
  enabled: false
  reason: ""
  min-level: 30

# /prison: how long the prison key from /tools locks a player away
prison:
  tool-time: 15m

# Team protocol (/stafflog): also write down every command the team types (private messages are left out)
staff-log:
  commands: true

# Chests marked as bait with the bait tool. The team is told when a player opens one.
bait-chests: []

# /fakebase: bait bases deep underground. Gone again after this many minutes, everything as before.
fakebase:
  minutes: 30
  # at most this many at the same time
  max: 5

# ---- Modules (/sc modules: left-click on or off, right-click for settings) ----
homes:
  enabled: true
  max: 3
  # seconds standing still before the teleport, and seconds between two uses
  warmup: 3
  cooldown: 0
tpa:
  enabled: true
  warmup: 3
  # seconds a request stays open
  timeout: 60
  cooldown: 10
money:
  enabled: true
  # what every new player starts with
  start: 100
  symbol: "$"
  # true: "100 $", false: "$100"
  symbol-after: false
esp:
  enabled: true
  # how far player tags reach, how many chunks around you chests are shown, and at most how many chests
  player-range: 128
  chest-chunks: 3
  chest-limit: 400
modules:
  lag: true
  prison: true
  fakebase: true
  trolls: true

# ---- Admin mode and /admin ----
admin-mode:
  # true: a team member is a normal player until they switch admin mode on (/admin).
  # Team commands and admin items only work in admin mode. The console is never limited.
  required: true
admin-panel:
  # the rank level needed to see a ticket of this kind in the /admin inbox (0 = every team member)
  ticket-levels:
    default: 0
    report: 30
    appeal: 50

# ---- Anti-cheat ----
# Every finding gives points by how clear it is (a totem back after 1 tick: 4, after 3 ticks: 1; flying: 20).
# Whoever reaches the limit is caught: an animation for everybody around, then the next step of the ladder.
anticheat:
  enabled: true
  auto-punish: true
  limit: 25
  # from this many points the player is marked for the team (/admin) and, with auto-watch, watched
  mark-at: 8
  auto-watch: true
  # watched players get this many times the points
  watch-multiplier: 1.5
  # after a big finding (10 points and more): a loud warning and this many seconds before the same check counts again
  grace-seconds: 6
  # one point fades every this many seconds
  fade-seconds: 60
  # caught at once by these, no warning: clear cheats
  instant: [fly, jesus, badpackets, elytra, trident]
  # what happens the 1st, 2nd, 3rd ... time somebody is caught. Real cheats (hard-checks) climb ladder-hard,
  # small things ladder-small. Steps: BAN <time|perm>, PLAYBAN <time>, PRISON <time>, KICK, CATEGORY <id>
  hard-checks: [fly, speed, jesus, step, nofall, reach, aura, velocity, timer, badpackets, nuker, scaffold, elytra, trident, xraybait, botmine]
  ladder-hard:
    - BAN 5m
    - BAN 1h
    - BAN 1d
    - CATEGORY cheating
  ladder-small:
    - PLAYBAN 10m
    - PLAYBAN 1h
    - PRISON 1h
    - BAN 1h
  # set the player back to the last place that was in order when a movement breaks the rules
  setback: true
  # hits with too much reach, behind the back or through walls do no damage
  block-hits: true
  # the fall still hurts when no fall damage came
  nofall-damage: true
  # a normal player who gets creative or spectator: false = only tell the team, true = also back to survival
  creative-guard: false
  # blocks per movement step on foot, before effects and ice
  step-speed: 0.75
  # blocks per step while gliding without a rocket
  elytra-speed: 2.6
  # blackhole, mace, lightning, random or none
  animation: random
  # below this TPS and above this ping movement is not judged, so lag never gets anyone punished
  min-tps: 18
  max-ping: 300
  # blocks per second on foot, before effects and ice
  speed-limit: 9.5
  max-cps: 22
  # movement packets per second (timer)
  max-packets: 23
  # x-ray: at least this many diamond ores or ancient debris in 30 minutes, and this share of all mined stone
  xray-ores: 10
  xray-ratio: 0.06
  # more than this many new accounts within 10 seconds: for 2 minutes only known players may join
  bot-joins: 6
  # per check: enabled, and a weight for its points (1.0 = as described)
  checks:
    fly: {enabled: true, weight: 1.0}
    speed: {enabled: true, weight: 1.0}
    reach: {enabled: true, weight: 1.0}
    aura: {enabled: true, weight: 1.0}
    autoclick: {enabled: true, weight: 1.0}
    nofall: {enabled: true, weight: 1.0}
    velocity: {enabled: true, weight: 1.0}
    xray: {enabled: true, weight: 1.0}
    timer: {enabled: true, weight: 1.0}
    step: {enabled: true, weight: 1.0}
    jesus: {enabled: true, weight: 1.0}
    fastbreak: {enabled: true, weight: 1.0}
    nuker: {enabled: true, weight: 1.0}
    scaffold: {enabled: true, weight: 1.0}
    noslow: {enabled: true, weight: 1.0}
    badpackets: {enabled: true, weight: 1.0}
    autototem: {enabled: true, weight: 1.0}
    anchor: {enabled: true, weight: 1.0}
    crystal: {enabled: true, weight: 1.0}
    bot: {enabled: true, weight: 1.0}
    aim: {enabled: true, weight: 1.0}
    criticals: {enabled: true, weight: 1.0}
    invmove: {enabled: true, weight: 1.0}
    fastbow: {enabled: true, weight: 1.0}
    snap: {enabled: true, weight: 1.0}
    botmine: {enabled: true, weight: 1.0}
    xraybait: {enabled: true, weight: 1.0}
    elytra: {enabled: true, weight: 1.0}
    trident: {enabled: true, weight: 1.0}

# ---- PlayBan ----
playban:
  # where the player goes when the PlayBan is over: LAST (where they were before), SPAWN, HOME, LOCATION or NONE
  end-teleport: LAST
  end-location:
    world: world
    x: 0
    y: 100
    z: 0
    yaw: 0

# ---- Announcements (/sc modules) ----
announcer:
  enabled: true
  interval-seconds: 300
  random: false
  sound: true
  # MiniMessage, one message per entry
  messages:
    - "<gray>Need help? Write <white>/ticket</white>, the team answers."
    - "<gray>Cheating is caught by the anti-cheat. Play fair!"
    - "<gray>Save your base with <white>/sethome</white>."

# ---- Mod guard (/sc modules) ----
# Finds clients and mods by the client name, the mod channels, and on Paper 1.21.9+ by a hidden sign with
# translation keys (probe). Many cheat clients hide themselves; behaviour is still judged by the anti-cheat.
# Actions: ALERT (tell the team), KICK, WARN (kick the first times with a request to remove it, then punish), PUNISH
mod-guard:
  enabled: true
  # BLOCKLIST: everything except the rules below. ALLOWLIST: only the clients in allowed-clients may join
  mode: BLOCKLIST
  allowed-clients: [vanilla, fabric, forge, neoforge, quilt, lunarclient, feather, badlion, labymod]
  not-allowed-action: KICK
  # how often WARN only kicks before it punishes
  warnings: 1
  # PLAYBAN <time>, BAN <time|perm>, KICK, CATEGORY <id>
  punishment: CATEGORY cheating
  probe: true
  rules:
    meteor: {brand: [meteor], channel: [meteor], keys: [key.meteor-client.open-gui], action: WARN}
    wurst: {brand: [wurst], channel: [wurst], keys: [key.wurst.zoom], action: WARN}
    liquidbounce: {brand: [liquidbounce], channel: [liquidbounce], action: WARN}
    aristois: {brand: [aristois], channel: [aristois], action: WARN}
    impact: {brand: [impact], channel: [impact], action: WARN}
    future: {brand: [future], channel: [future], action: WARN}
    rusherhack: {brand: [rusherhack], channel: [rusherhack], action: WARN}
    thunderhack: {brand: [thunderhack], channel: [thunderhack], action: WARN}
    bleachhack: {brand: [bleachhack], channel: [bleachhack], action: WARN}
    inertia: {brand: [inertia], channel: [inertia], action: WARN}
    freecam: {channel: [freecam], keys: [key.freecam.toggle], action: WARN}
    xray-mod: {channel: [xray], keys: [key.xray.toggle], action: WARN}
    minimap-radar: {channel: [xaerominimap, journeymap, voxelmap], action: ALERT}

# ---- Tests from /check (Tests button) ----
investigation:
  # shown as a clickable link in the screen check, e.g. your Discord voice channel
  screenshare-link: ""

# ---- Banhammer (admin item) ----
# A hit: the hammer animation, then this. KICK, PLAYBAN <time>, BAN <time|perm>, CATEGORY <id>.
# Sneaking while hitting opens the punish menu instead.
banhammer:
  action: KICK
  # empty = the text from the language file
  reason: ""
