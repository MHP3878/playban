# StaffCore - deutsche Texte
# Farben nutzen das MiniMessage-Format: https://docs.advntr.dev/minimessage/format.html
# Wörter in {geschweiften Klammern} füllt das Plugin aus - bitte so stehen lassen.

prefix: "<gradient:#ff5f6d:#ffc371><bold>StaffCore</bold></gradient> <dark_gray>»</dark_gray> "
none: "niemand"
no-reason: "Kein Grund angegeben"
no-limit: "keine Frist"
staff-team: "das Serverteam"
online: "<green>online"
offline: "<gray>offline"
reloaded: "<green>Einstellungen neu geladen."
language-set: "<green>Sprache auf <white>{language}</white> gestellt."

permanent: "für immer"
never: "nie"
custom: "frei gewählt"
applied: "<gray><white>{player}</white>: <white>{n}.</white> Verstoß in <white>{category}</white> → <white>{punishment}"

type:
  MUTE: "Mute"
  IPBAN: "IP-Bann"
  SPECBAN: "Zuschauer-Bann"
  WARN: "Verwarnung"
  PLAYBAN: "PlayBan"
  BAN: "Bann"

warn:
  title: "<yellow><bold>VERWARNUNG</bold></yellow>"
  subtitle: "<gray>{reason}"
  you: "<yellow>Du wurdest vom Serverteam verwarnt. Grund: <white>{reason}"
  broadcast: "<white>{staff}</white> <gray>hat</gray> <white>{player}</white> <gray>verwarnt. Grund:</gray> <white>{reason}"

ban:
  id-line: "<gray>Ban-ID: <white>{id}"
  broadcast-spectator: "<white>{staff}</white> <gray>hat</gray> <white>{player}</white> <gray>einen Zuschauer-Bann gegeben. Dauer:</gray> <white>{time}</white><gray>. Grund:</gray> <white>{reason}"
  discord-line: "<gray>Discord: <#ffc371>{discord}"
  screen: |-
    <gradient:#ff5f6d:#ffc371><bold>StaffCore</bold></gradient>

    <red>Du bist von diesem Server gebannt.

    <gray>Grund: <white>{reason}
    <gray>Restzeit: <white>{time}
    <gray>Gebannt von: <white>{staff}
  broadcast: "<white>{staff}</white> <gray>hat</gray> <white>{player}</white> <gray>gebannt. Dauer:</gray> <white>{time}</white><gray>. Grund:</gray> <white>{reason}"
  broadcast-unbanned: "<white>{staff}</white> <gray>hat</gray> <white>{player}</white> <gray>entbannt."

limbo:
  id: "<gray>Deine Ban-ID: <white>{id}</white>. Antrag mit <#ffc371>/appeal {id} <Text></#ffc371>"
  title: "<red><bold>GEBANNT</bold></red>"
  subtitle: "<gray>Restzeit: <white>{time}"
  status: "<red>Du bist gebannt und kannst nur zuschauen. <gray>Restzeit: <white>{time}</white>. Grund: <white>{reason}"
  hint: "<gray>Du willst Einspruch einlegen? Schreib <#ffc371>/ticket <deine Nachricht></#ffc371>."
  discord: "<gray>Unser Discord: <click:open_url:'{discord}'><#ffc371><underlined>{discord}</underlined></#ffc371></click>"
  bossbar: "<red><bold>GEBANNT</bold></red> <dark_gray>|</dark_gray> <gray>noch</gray> <white>{time}</white> <dark_gray>|</dark_gray> <#ffc371>/ticket <Nachricht>"
  default-location: "Welt-Spawn"

profile:
  state:
    free: "<green>nicht bestraft"
    playban: "<gold>PlayBan läuft"
    banned: "<red>gebannt"

note:
  added: "<green>Notiz zu <white>{player}</white> gespeichert."

actionbar: "<gray>PlayBan <dark_gray>|</dark_gray> <gray>noch <white>{time}</white> <dark_gray>|</dark_gray> <gray>Grund: <white>{reason}"

vanish:
  "on": "<gray>Du bist jetzt <white>unsichtbar</white>. Spieler sehen dich nicht, und dein Chat geht nur ans Team. Mit <white>!</white> vor der Nachricht schreibst du öffentlich. Mit <#ffc371>/vanish</#ffc371> zeigst du dich wieder."
  actionbar: "<#ffc371><bold>VANISH</bold></#ffc371> <dark_gray>|</dark_gray> <gray>Nur das Team sieht dich"
  still: "<gray>Du bist noch <white>unsichtbar</white>. Mit <#ffc371>/vanish</#ffc371> zeigst du dich wieder."
  death: "<white>{player}</white> ist gestorben"
  chat: "<dark_gray>[<#ffc371>Vanish</#ffc371>]</dark_gray> <white>{player}</white><gray>:</gray> <white>{text}"
  "off": "<gray>Du bist wieder <white>sichtbar</white>."

appeal:
  not-punished: "<gray>Du bist nicht bestraft, es gibt also nichts zu beantragen."
  usage: "<gray>Nutzung: <white>/appeal {id} <warum du entbannt werden solltest></white>"
  wrong-id: "<red>Diese Ban-ID gehört nicht zu deiner Strafe. Schau auf deinen Bann-Bildschirm."
  too-short: "<red>Bitte erklär es etwas genauer, mindestens 10 Zeichen."
  ticket-text: "Entbannungsantrag für Bann {id}: {text}"
  received: "<green>Dein Antrag für Bann <white>{id}</white> ist als Ticket <white>#{ticket}</white> angekommen. Das Team meldet sich bei dir."

inventory-mode:
  KEEP: "alles behalten"
  STORE: "wegnehmen, am Ende zurückgeben"
  CLEAR: "für immer löschen"

guide:
