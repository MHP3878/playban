  ban: ["<gray>Ein echter Bann: Der Spieler kommt", "<gray>nicht mehr rein. Mit perm für immer.", "", "<dark_gray>Beispiel: /ban Steve 7d Hacking"]
  specban: ["<gray>Der Spieler darf rein, hängt aber", "<gray>als Zuschauer fest und kann nur", "<gray>Tickets oder einen Antrag schreiben."]
  warn: ["<gray>Eine Verwarnung. Zählt als Verstoß", "<gray>für die Kategorien.", "", "<dark_gray>Beispiel: /warn Steve Spam"]
  unban: ["<gray>Hebt einen Bann auf. Geht mit dem", "<gray>Namen oder mit der Ban-ID.", "", "<dark_gray>Beispiel: /unban K7QX2M"]
  pardon: ["<gray>Beendet einen laufenden PlayBan sofort."]
  time: ["<gray>Macht einen PlayBan länger oder kürzer.", "", "<dark_gray>Beispiel: /sc addtime Steve 1h"]
  note: ["<gray>Schreibt eine Notiz zu einem Spieler.", "<gray>Nur das Team sieht sie."]
  profile: ["<gray>Notizen, Strafen und Tickets", "<gray>eines Spielers."]
  vanish: ["<gray>Macht dich für Spieler unsichtbar.", "<gray>Das Team sieht dich weiterhin."]
  ticket-show: ["<gray>Alle Tickets, mit Filtern.", "", "<dark_gray>Beispiel: /ticket show report"]
  voice: ["<gray>Voice-Gruppen verwalten.", "<gray>Braucht Simple Voice Chat."]
  ticket: ["<gray>Dem Serverteam schreiben:", "<gray>Spieler melden, etwas fragen,", "<gray>einen Bug melden."]
  appeal: ["<gray>Entbannung beantragen. Du brauchst", "<gray>die Ban-ID von deinem Bann-Bildschirm."]
  tasks: ["<gray>Wenn du bestraft bist: zeigt", "<gray>Restzeit, Grund und die Aufgaben,", "<gray>die deine Zeit verkürzen."]

