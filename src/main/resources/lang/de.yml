  disabled: "<red>/spawn ist auf diesem Server ausgeschaltet."
  warmup: "<gray>Teleport zum Spawn in <white>{seconds}</white> Sekunden. Nicht bewegen."
  countdown: "<#ffc371>Spawn in <white>{seconds}</white>..."
  done: "<green>Willkommen am Spawn."
  moved: "<red>Du hast dich bewegt, der Teleport wurde abgebrochen."
  hurt: "<red>Du hast Schaden bekommen, der Teleport wurde abgebrochen."
  cooldown: "<red>Du kannst /spawn erst in <white>{time}</white> wieder nutzen."
  set: "<green>Spawn gesetzt auf <white>{world} {x} {y} {z}</white>."
  sent: "<gray><white>{player}</white> zum Spawn geschickt."
  sent-you: "<gray><white>{staff}</white> hat dich zum Spawn geschickt."
  join-mode:
    NEVER: "nie"
    FIRST_JOIN: "nur neue Spieler"
    ALWAYS: "jedes Mal"

