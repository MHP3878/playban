  menu: ["<gray>Öffnet das Hauptmenü.", "<gray>Von hier aus geht alles."]
  punish: ["<gray>Kategorie für einen Spieler wählen.", "<gray>StaffCore berechnet die Strafe aus", "<gray>seinen früheren Verstößen.", "", "<dark_gray>Beispiel: /punish Steve"]
