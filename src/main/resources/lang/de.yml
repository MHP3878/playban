  mods: ["<gray>Welchen Client und welche Mods ein", "<gray>Spieler hat, soweit der Client es sagt.", "<gray>/mods reset <spieler> löscht Verwarnungen."]
  check: ["<gray>Alles über einen Spieler auf einer", "<gray>Live-Seite: Ping, Client, Klicks,", "<gray>Anti-Cheat-Punkte und Funde, letzte", "<gray>Befehle, und Knöpfe für Inventar,", "<gray>Einfrieren, Beobachten, Bestrafen."]
  lag: ["<gray>TPS, Tick-Zeit und die vollsten", "<gray>Chunks, ein Klick bringt dich hin.", "<gray>/cleanup räumt herumliegende Items weg."]
  announce: ["<gray>Eine Nachricht mit Titel an alle.", "<gray>/announce next schickt die nächste", "<gray>Nachricht der Liste."]
  admin: ["<gray>Dein Admin-Panel: Postfach mit Tickets", "<gray>und markierten Spielern, Admin-Modus,", "<gray>Vanish, Geistermodus, ESP und alle", "<gray>Befehle, die du nutzen darfst."]
  anticheat: ["<gray>Vom Anti-Cheat markierte Spieler.", "<gray>/anticheat clear <spieler> nimmt", "<gray>die Markierung weg."]
  modules: ["<gray>Alle Systeme in einem Menü: Homes,", "<gray>Teleport-Anfragen, Geld, Spawn,", "<gray>Ränge, ESP, Block-Protokoll und mehr.", "<gray>Linksklick: an oder aus.", "<gray>Rechtsklick: Einstellungen."]
  esp: ["<gray>Kisten leuchten durch Wände, Spieler", "<gray>bekommen Namensschilder mit Leben,", "<gray>Entfernung und Item. Nur du siehst es.", "", "<dark_gray>Beispiel: /esp all"]
  home: ["<gray>Orte speichern und zurück-", "<gray>teleportieren. /homes zeigt sie als Menü.", "", "<dark_gray>Beispiel: /sethome farm, /home farm"]
  tpa: ["<gray>Einen Spieler fragen, ob du zu ihm", "<gray>(/tpa) oder er zu dir (/tpahere) darf.", "<gray>Er nimmt mit einem Klick an."]
  money: ["<gray>Dein Geld, anderen Spielern Geld", "<gray>geben und die reichsten Spieler.", "", "<dark_gray>Beispiel: /pay Steve 50"]
  eco: ["<gray>Geld von jedem geben, nehmen", "<gray>oder setzen.", "", "<dark_gray>Beispiel: /eco give Steve 500"]
  fakebase: ["<gray>Eine Köder-Base tief unter der Erde:", "<gray>Kisten, Öfen, Betten und zwei Fake-", "<gray>Spieler. Wer direkt hingräbt oder eine", "<gray>Kiste öffnet, wird gemeldet. Nichts ist", "<gray>abbaubar, nach 30 Minuten ist sie weg", "<gray>und alles sieht aus wie vorher.", "", "<dark_gray>Beispiel: /fakebase Steve"]
  prison: ["<gray>Mauert den Spieler in eine Grundstein-", "<gray>Zelle ein. Das Inventar wird zu grauen", "<gray>Schlössern: keine Items, kein Scrollen,", "<gray>keine Befehle. Danach kommt alles zurück.", "", "<dark_gray>Beispiel: /prison Steve 30m Griefing"]
  unprison: ["<gray>Lässt einen Spieler aus dem Gefängnis.", "<gray>Die Blöcke drumherum und die Items", "<gray>kommen zurück wie vorher."]
  troll: ["<gray>Harmlose Späße: Hühnerregen, Fake-", "<gray>Stash, Fake-OP-Nachricht, Drehen.", "<gray>Niemand wird verletzt oder verliert was.", "", "<dark_gray>Beispiel: /troll Steve chickens"]
  stafflog: ["<gray>Das Team-Protokoll: wer wen bestraft,", "<gray>eingesperrt oder getrollt hat und", "<gray>welche Befehle das Team benutzt hat.", "", "<dark_gray>Beispiel: /stafflog Steve"]

  mute: ["<gray>Der Spieler kann nicht chatten und", "<gray>kein /msg nutzen. Ohne Zeit für immer.", "", "<dark_gray>Beispiel: /mute Steve 1h Spam"]
  ipban: ["<gray>Bannt den Spieler und die Adresse,", "<gray>von der er spielt. Ein Zweit-Account", "<gray>hilft dann nicht."]
  lockdown: ["<gray>Nur das Team kann beitreten, alle", "<gray>anderen werden gekickt. Nochmal zum Öffnen.", "", "<dark_gray>Beispiel: /lockdown on Wartung"]
  mutechat: ["<gray>Nur das Team kann im Chat schreiben.", "<gray>Nochmal zum Öffnen."]
  slowchat: ["<gray>Spieler dürfen nur alle paar", "<gray>Sekunden schreiben.", "", "<dark_gray>Beispiel: /slowchat 5"]
  whois: ["<gray>Rang, erster und letzter Besuch, Spielzeit,", "<gray>Strafen, Notizen, gleiche Adresse und", "<gray>wo der Spieler gerade ist."]
  alts: ["<gray>Accounts, die von derselben Adresse", "<gray>kamen."]
  stafflist: ["<gray>Welche Team-Mitglieder online sind."]
  near: ["<gray>Spieler in deiner Nähe, mit Entfernung."]
  report: ["<gray>Einen Spieler beim Team melden.", "", "<dark_gray>Beispiel: /report Steve hat mein Haus zerstört"]
  blocklog: ["<gray>Wer welchen Block abgebaut, gesetzt oder", "<gray>gesprengt hat, wer was aus Kisten nahm.", "<gray>Rückgängig machen oder als Replay ansehen.", "", "<dark_gray>Beispiel: /bl near 10 2h"]
  staffmode: ["<gray>Verwahrt dein Inventar und gibt dir", "<gray>alle Admin-Items. Nochmal zum Verlassen."]
  tools: ["<gray>Öffnet die Admin-Items: Bannhammer,", "<gray>Freeze-Stab, Handschellen, Inspektor,", "<gray>Teleport-Kompass, Vanish-Umhang, X-Ray."]
  tpadmin: ["<gray>Macht dich unsichtbar und bringt dich", "<gray>zu einem Spieler. /tpback bringt dich zurück.", "", "<dark_gray>Beispiel: /tpadmin Steve"]
  tphere: ["<gray>Holt einen Spieler zu dir."]
  freeze: ["<gray>Friert einen Spieler ein: kein Bewegen,", "<gray>Bauen oder Kämpfen. Nochmal zum Aufheben.", "<gray>Ausloggen wird gemeldet."]
  invsee: ["<gray>Öffnet das Inventar eines Spielers.", "<gray>/endersee öffnet die Enderkiste.", "<gray>Admins können auch Items verschieben."]
  teamchat: ["<gray>Schaltet den Team-Chat an oder aus.", "<gray>Mit Text wird nur der gesendet.", "", "<dark_gray>Beispiel: /teamchat schaut mal zum Spawn"]
  clearchat: ["<gray>Leert den Chat für Spieler.", "<gray>Das Team behält ihn."]
  fly: ["<gray>Fliegen an oder aus. Admins können", "<gray>einen Spielernamen dazuschreiben."]
  heal: ["<gray>Volle Gesundheit und Hunger, entfernt", "<gray>schlechte Effekte und Feuer."]
  god: ["<gray>Du bekommst keinen Schaden und", "<gray>keinen Hunger. Nochmal zum Aufheben."]
  rank: ["<gray>Gibt einem Spieler einen Rang.", "<gray>Nur Ränge unter deinem eigenen Level.", "", "<dark_gray>Beispiel: /rank set Steve mod"]
  rank-setup: ["<gray>Macht dich zum Owner, einmalig, solange", "<gray>niemand den höchsten Rang hat.", "<gray>Danach gelten die Befehls-Level."]
  spawn: ["<gray>Bringt dich zum Spawn.", "<gray>Bleib beim Countdown stehen."]
