  ipban: ["<gray>Bannt den Spieler und die Adresse,", "<gray>von der er spielt. Ein Zweit-Account", "<gray>hilft dann nicht."]
  lockdown: ["<gray>Nur das Team kann beitreten, alle", "<gray>anderen werden gekickt. Nochmal zum Öffnen.", "", "<dark_gray>Beispiel: /lockdown on Wartung"]
  mutechat: ["<gray>Nur das Team kann im Chat schreiben.", "<gray>Nochmal zum Öffnen."]
  slowchat: ["<gray>Spieler dürfen nur alle paar", "<gray>Sekunden schreiben.", "", "<dark_gray>Beispiel: /slowchat 5"]
  whois: ["<gray>Rang, erster und letzter Besuch, Spielzeit,", "<gray>Strafen, Notizen, gleiche Adresse und", "<gray>wo der Spieler gerade ist."]
  alts: ["<gray>Accounts, die von derselben Adresse", "<gray>kamen."]
  stafflist: ["<gray>Welche Team-Mitglieder online sind."]
  near: ["<gray>Spieler in deiner Nähe, mit Entfernung."]
  report: ["<gray>Einen Spieler beim Team melden.", "", "<dark_gray>Beispiel: /report Steve hat mein Haus zerstört"]
  blocklog: ["<gray>Wer welchen Block abgebaut, gesetzt oder", "<gray>gesprengt hat, wer was aus Kisten nahm.", "<gray>Rückgängig machen oder als Replay ansehen.", "", "<dark_gray>Beispiel: /bl near 10 2h"]
  staffmode: ["<gray>Verwahrt dein Inventar und gibt dir", "<gray>alle Admin-Items. Nochmal zum Verlassen."]
  tools: ["<gray>Öffnet die Admin-Items: Bannhammer,", "<gray>Freeze-Stab, Handschellen, Inspektor,", "<gray>Teleport-Kompass, Vanish-Umhang, X-Ray."]
  tpadmin: ["<gray>Macht dich unsichtbar und bringt dich", "<gray>zu einem Spieler. /tpback bringt dich zurück.", "", "<dark_gray>Beispiel: /tpadmin Steve"]
  tphere: ["<gray>Holt einen Spieler zu dir."]
  freeze: ["<gray>Friert einen Spieler ein: kein Bewegen,", "<gray>Bauen oder Kämpfen. Nochmal zum Aufheben.", "<gray>Ausloggen wird gemeldet."]
  invsee: ["<gray>Öffnet das Inventar eines Spielers.", "<gray>/endersee öffnet die Enderkiste.", "<gray>Admins können auch Items verschieben."]
  teamchat: ["<gray>Schaltet den Team-Chat an oder aus.", "<gray>Mit Text wird nur der gesendet.", "", "<dark_gray>Beispiel: /teamchat schaut mal zum Spawn"]
  clearchat: ["<gray>Leert den Chat für Spieler.", "<gray>Das Team behält ihn."]
  fly: ["<gray>Fliegen an oder aus. Admins können", "<gray>einen Spielernamen dazuschreiben."]
  heal: ["<gray>Volle Gesundheit und Hunger, entfernt", "<gray>schlechte Effekte und Feuer."]
  god: ["<gray>Du bekommst keinen Schaden und", "<gray>keinen Hunger. Nochmal zum Aufheben."]
  rank: ["<gray>Gibt einem Spieler einen Rang.", "<gray>Nur Ränge unter deinem eigenen Level.", "", "<dark_gray>Beispiel: /rank set Steve mod"]
  rank-setup: ["<gray>Macht dich zum Owner, einmalig, solange", "<gray>niemand den höchsten Rang hat.", "<gray>Danach gelten die Befehls-Level."]
  spawn: ["<gray>Bringt dich zum Spawn.", "<gray>Bleib beim Countdown stehen."]
  setspawn: ["<gray>Setzt den Spawn dort, wo du stehst."]
  menu: ["<gray>Öffnet das Hauptmenü.", "<gray>Von hier aus geht alles."]
  punish: ["<gray>Kategorie für einen Spieler wählen.", "<gray>StaffCore berechnet die Strafe aus", "<gray>seinen früheren Verstößen.", "", "<dark_gray>Beispiel: /punish Steve"]
  apply: ["<gray>Wie /punish, aber ohne Menü.", "<gray>Geht auch von der Konsole.", "", "<dark_gray>Beispiel: /sc apply Steve x-ray"]
  ban: ["<gray>Ein echter Bann: Der Spieler kommt", "<gray>nicht mehr rein. Mit perm für immer.", "", "<dark_gray>Beispiel: /ban Steve 7d Hacking"]
  specban: ["<gray>Der Spieler darf rein, hängt aber", "<gray>als Zuschauer fest und kann nur", "<gray>Tickets oder einen Antrag schreiben."]
  warn: ["<gray>Eine Verwarnung. Zählt als Verstoß", "<gray>für die Kategorien.", "", "<dark_gray>Beispiel: /warn Steve Spam"]
  unban: ["<gray>Hebt einen Bann auf. Geht mit dem", "<gray>Namen oder mit der Ban-ID.", "", "<dark_gray>Beispiel: /unban K7QX2M"]
  pardon: ["<gray>Beendet einen laufenden PlayBan sofort."]
  time: ["<gray>Macht einen PlayBan länger oder kürzer.", "", "<dark_gray>Beispiel: /sc addtime Steve 1h"]
  note: ["<gray>Schreibt eine Notiz zu einem Spieler.", "<gray>Nur das Team sieht sie."]
  profile: ["<gray>Notizen, Strafen und Tickets", "<gray>eines Spielers."]
  vanish: ["<gray>Macht dich für Spieler unsichtbar.", "<gray>Das Team sieht dich weiterhin."]
  ticket-show: ["<gray>Alle Tickets, mit Filtern.", "", "<dark_gray>Beispiel: /ticket show report"]
  voice: ["<gray>Voice-Gruppen verwalten.", "<gray>Braucht Simple Voice Chat."]
  ticket: ["<gray>Dem Serverteam schreiben:", "<gray>Spieler melden, etwas fragen,", "<gray>einen Bug melden."]
  appeal: ["<gray>Entbannung beantragen. Du brauchst", "<gray>die Ban-ID von deinem Bann-Bildschirm."]
  tasks: ["<gray>Wenn du bestraft bist: zeigt", "<gray>Restzeit, Grund und die Aufgaben,", "<gray>die deine Zeit verkürzen."]

