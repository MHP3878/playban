bossbar: "<gradient:#ff5f6d:#ffc371><bold>PlayBan</bold></gradient> <dark_gray>|</dark_gray> <gray>noch</gray> <white>{time}</white> <dark_gray>|</dark_gray> <gray>Aufgaben</gray> <white>{done}/{total}</white> <dark_gray>|</dark_gray> <#ffc371>/playban"

