  removed-you: "<green>Deine Strafe wurde um <white>{time}</white> verkürzt."
  changed: "<gray><white>{player}</white> hat jetzt noch <white>{time}</white>."

info:
  line: "<white>{player}</white> <dark_gray>|</dark_gray> <gray>noch:</gray> <white>{time}</white> <dark_gray>|</dark_gray> <gray>Grund:</gray> <white>{reason}</white> <dark_gray>|</dark_gray> <gray>von:</gray> <white>{staff}</white> <dark_gray>|</dark_gray> <gray>Aufgaben:</gray> <white>{done}/{total}"

list:
