  rejected: "<gray>Nachricht von <white>{player}</white> abgelehnt."
  rejected-you: "<red>Das Team hat deine Nachricht abgelehnt. Du kannst die Aufgabe noch einmal versuchen."
  delivered: "<gray>Eine Nachricht für dich von <white>{player}</white>:</gray> <white>{text}"

ticket:
