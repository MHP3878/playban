      name: "<#ffc371><bold>Admin items</bold>"
      lore: ["<gray>Bannhammer, freeze wand, handcuffs,", "<gray>x-ray and more.", "", "<#ffc371>Click to open"]
    ranks:
      name: "<#ffc371><bold>Ranks</bold>"
      lore: ["<gray>Ranks: <white>{count}", "<gray>Owner, Admin, Mod and more,", "<gray>and which commands need which level.", "", "<#ffc371>Click to open"]
    guide:
      name: "<#ffc371><bold>Command guide</bold>"
      lore: ["<gray>Every command with what it", "<gray>does and an example.", "", "<#ffc371>Click to open"]
    voice:
      name: "<#ffc371><bold>Voice groups</bold>"
      lore: ["<gray>Groups: <white>{count}", "", "<#ffc371>Click to open"]
    bans:
      name: "<#ffc371><bold>Banned players</bold>"
      lore: ["<gray>Currently: <white>{count}", "", "<#ffc371>Click to open"]
    categories:
      name: "<#ffc371><bold>Categories</bold>"
      lore: ["<gray>Categories: <white>{count}", "<gray>What players get punished for", "<gray>and what happens each time.", "", "<#ffc371>Click to edit"]
    punish:
      name: "<gradient:#ff5f6d:#ffc371><bold>Punish a player</bold></gradient>"
      lore: ["<gray>Pick a player, a duration", "<gray>and a reason.", "", "<#ffc371>Click to start"]
    active:
      name: "<#ffc371><bold>Punished players</bold>"
      lore: ["<gray>Currently: <white>{count}", "", "<#ffc371>Click to open"]
    reviews:
      name: "<#ffc371><bold>Check messages</bold>"
      lore: ["<gray>Waiting: <white>{count}", "<gray>Messages from punished players", "<gray>that you approve or reject.", "", "<#ffc371>Click to open"]
    tickets:
      name: "<#ffc371><bold>Tickets</bold>"
      lore: ["<gray>Waiting: <white>{count}", "<gray>In progress: <white>{progress}", "", "<#ffc371>Click to open"]
    history:
      name: "<#ffc371><bold>Player profile</bold>"
      lore: ["<gray>Notes and earlier punishments", "<gray>of a player.", "", "<#ffc371>Click and type a name"]
    tasks:
      name: "<#ffc371><bold>Tasks</bold>"
      lore: ["<gray>Tasks: <white>{count}", "<gray>What punished players can do", "<gray>to shorten their time.", "", "<#ffc371>Click to edit"]
    settings:
      name: "<#ffc371><bold>Settings</bold>"
      lore: ["<gray>What punished players may do", "<gray>and how the time is counted.", "", "<#ffc371>Click to open"]
    language:
      name: "<#ffc371><bold>Language</bold>"
      lore: ["<gray>Current: <white>{language}", "", "<#ffc371>Click to switch"]

  category:
    title: "<dark_gray>What did {player} do?"
    entry:
      name: "<#ffc371><bold>{category}</bold>"
      lore: ["<gray>This would be offense no. <white>{n}", "<gray>Punishment: <white>{punishment}", "", "<#ffc371>Click to pick"]
    custom-playban:
      name: "<#ffc371>Custom PlayBan"
      lore: ["<gray>Pick duration and reason yourself."]
    custom-specban:
      name: "<#ffc371>Custom spectator ban"
      lore: ["<gray>The player may join, but is stuck", "<gray>as a spectator and can only", "<gray>write tickets."]
    custom-ban:
      name: "<#ffc371>Custom ban"
      lore: ["<gray>Pick duration and reason yourself."]
    custom-warn:
      name: "<#ffc371>Custom warning"
      lore: ["<gray>Click and type the reason."]

  bans:
    title: "<dark_gray>Banned players"
    empty:
      name: "<green>Nobody is banned"
    entry:
      name: "<white>{player}"
      lore:
        - "<gray>Kind: <white>{type}"
        - "<gray>Left: <white>{time}"
        - "<gray>Reason: <white>{reason}"
        - "<gray>By: <white>{staff}</white> <dark_gray>{date}"
        - ""
        - "<red>Shift + click to unban"

  categories:
    title: "<dark_gray>Categories"
    step: "<gray>{n}. offense: <white>{punishment}"
    step-last: "<gray>from the {n}. offense: <white>{punishment}"
