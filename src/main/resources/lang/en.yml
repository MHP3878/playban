    accept:
      name: "<green><bold>Accept</bold>"
      lore: ["<gray>You take over this ticket and", "<gray>the player joins the ticket chat."]
    decline:
      name: "<red><bold>Decline</bold>"
      lore: ["<gray>The ticket is closed without action."]
    tab-current:
      name: "<#ffc371><bold>#{id} {player}</bold>"
      lore: ["<gray>You are looking at this ticket."]
    tab:
      name: "<white>#{id} {player}"
      lore: ["<#ffc371>Click to switch to this ticket"]
    archived:
      name: "<gray>This ticket is {status}"
    entry:
      CHAT: "<white>{author} <dark_gray>{date}"
      STAFF: "<#ff5f6d>{author} <dark_gray>{date}"
      NOTE: "<#ffc371>Remark by {author} <dark_gray>{date}"
      SYSTEM: "<gray>System <dark_gray>{date}"
      only-to: "<dark_gray>Only to {player}"
      star: ["", "<#ffc371>Click to mark with a star"]
      unstar: ["", "<#ffc371>Click to remove the star"]
    person:
      name: "<white>{player}"
      actions: ["", "<#ffc371>Left click: write only to this player", "<#ffc371>Right click: profile", "<red>Shift + click: remove from the ticket"]
      actions-closed: ["", "<#ffc371>Click: profile"]
    older:
      name: "<gray>« Older messages"
    newer:
      name: "<gray>Newer messages »"
    write:
      name: "<#ffc371><bold>Write</bold>"
      lore: ["<#ffc371>Left click: write to everyone", "<#ffc371>Right click: quick replies"]
    note:
      name: "<#ffc371>Remark"
      lore: ["<gray>A note in the ticket that", "<gray>only the team sees."]
    pause:
      name: "<#ffc371>Pause the chat"
      lore: ["<gray>The players are back in the", "<gray>normal chat until you continue."]
    resume:
      name: "<green>Continue the chat"
      lore: ["<gray>The players write to the", "<gray>team again."]
    shared:
      name: "<#ffc371>One chat for all"
      lore: ["<gray>The players read each other.", "", "<#ffc371>Click to separate them"]
    separate:
      name: "<#ffc371>Separate chats"
      lore: ["<gray>Each player only talks to the team.", "", "<#ffc371>Click to put them together"]
    add-player:
      name: "<#ffc371>Add a player"
      lore: ["<gray>Pull another player into", "<gray>this ticket."]
    teleport:
      name: "<#ffc371>Teleport"
      lore: ["<gray>Jump to a player in this ticket.", "<gray>It is written into the ticket."]
    voice:
      name: "<#ffc371>Voice"
      lore: ["<gray>Shows everyone a big red invite", "<gray>with your Discord link."]
    close:
      name: "<green><bold>Finish the ticket</bold>"
      lore: ["<gray>Decide for every player what", "<gray>happens, then close it."]

  ticket-replies:
    title: "<dark_gray>Quick replies"
    entry: "<#ffc371>Quick reply"
    empty:
      name: "<gray>No quick replies yet"

  ticket-add:
    title: "<dark_gray>Add which player?"

  ticket-tp:
    title: "<dark_gray>Teleport"
    nobody:
      name: "<red>Nobody from this ticket is online"
    target: ["<#ffc371>Click to pick this player"]
    target-picked: ["<green>✔ picked"]
    mode:
