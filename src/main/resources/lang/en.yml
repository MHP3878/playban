        name: "<#ffc371>Survival"
        lore: ["<gray>Teleport to <white>{player}</white>."]
      CREATIVE:
        name: "<#ffc371>Creative"
        lore: ["<gray>Teleport to <white>{player}</white>."]
      SPECTATOR:
        name: "<#ffc371>Spectator"
        lore: ["<gray>Teleport to <white>{player}</white>."]
      VANISH:
        name: "<#ffc371>Invisible"
        lore: ["<gray>Teleport to <white>{player}</white>.", "<gray>Players cannot see you,", "<gray>your game mode stays."]
    return:
      name: "<green>Go back"
      lore: ["<gray>Back to where you were,", "<gray>in your old game mode."]

