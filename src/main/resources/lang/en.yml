      name: "<green>New category"
      lore: ["<gray>Click and type the name."]
    entry:
      lore: ["<gray>Offenses expire: <white>{expire}", "", "<#ffc371>Click to edit"]

  category-edit:
    title: "<dark_gray>Category: {category}"
    name:
      name: "<#ffc371>Name"
      lore: ["<gray>Current: <white>{value}", "", "<#ffc371>Click to change"]
    icon:
      name: "<#ffc371>Icon"
      lore: ["<#ffc371>Hold an item and click"]
    expire:
      name: "<#ffc371>Offenses expire after"
      lore: ["<gray>Current: <white>{value}", "<gray>Older offenses no longer count", "<gray>for the steps.", "", "<#ffc371>Click to change"]
    delete:
      name: "<red>Delete category"
      lore: ["<gray>Shift + click to delete."]
    step:
      name: "<#ffc371>{n}. offense"
      lore: ["<gray>Punishment: <white>{punishment}", "", "<#ffc371>Left click: change the kind", "<#ffc371>Right click: change the duration", "<red>Shift + click: remove"]
    add-step:
      name: "<green>Add a step"
      lore: ["<gray>Starts as a copy of the last step."]

  profile:
    title: "<dark_gray>Profile: {player}"
    summary:
      name: "<white>{player} <dark_gray>({online}<dark_gray>)"
      lore:
        - "<gray>Status: {state}"
        - "<gray>PlayBans: <white>{playbans}"
        - "<gray>Bans: <white>{bans}"
        - "<gray>Warnings: <white>{warns}"
        - "<gray>Notes: <white>{notes}"
    note:
      name: "<#ffc371>{author} <dark_gray>{date}"
      actions: ["", "<red>Shift + click to delete"]
    no-notes:
      name: "<gray>No notes yet"
    add-note:
      name: "<green>Write a note"
      lore: ["<gray>Click and type it into the chat."]
    history:
      name: "<#ffc371>Punishments"
      lore: ["<gray>Entries: <white>{count}", "", "<#ffc371>Click to open"]
    punish:
      name: "<gradient:#ff5f6d:#ffc371><bold>Punish</bold></gradient>"
      lore: ["<gray>Pick a category for this player."]
    tickets:
      name: "<#ffc371>Tickets"
      lore: ["<gray>Tickets with this player: <white>{count}", "", "<#ffc371>Click to open"]
    same-address:
      name: "<yellow>Possible second account"
      lore: ["<gray>Same address as:", "<white>{players}"]

  screen:
    title: "<dark_gray>Ban screen"
    empty-line: "<dark_gray>(empty line)"
    sample-reason: "Example reason"
    line-actions: ["<dark_gray>Line {n}", "", "<#ffc371>Click to change", "<red>Shift + click to remove"]
    preview:
      name: "<#ffc371>Preview"
      lore: ["<gray>Shows the screen in your chat."]
    discord:
      name: "<#ffc371>Discord link"
      lore: ["<gray>Current: <white>{value}", "<gray>Shown on the ban screen and to", "<gray>spectator-banned players.", "", "<#ffc371>Click to change"]
    add:
      name: "<green>Add a line"
      lore: ["<gray>Click and type it into the chat."]
    reset:
      name: "<red>Back to the default text"
      lore: ["<gray>Shift + click to reset."]

  voice:
    title: "<dark_gray>Voice groups"
    group-title: "<dark_gray>Group: {group}"
    member-title: "<dark_gray>{player}"
    bans-title: "<dark_gray>Banned from this group"
    manage-title: "<dark_gray>Your group: {group}"
    report-title: "<dark_gray>Which group do you want to report?"
    report-why: "<dark_gray>What is wrong with {group}?"
    report-reason: "<#ffc371>{reason}"
    report-pick: ["<#ffc371>Click to pick"]
    unban: ["<#ffc371>Click to unban"]
    manage-actions: ["<#ffc371>Click: remove from the group", "<red>Shift + click: ban from the group"]
    empty:
      name: "<gray>No voice groups right now"
    no-bans:
      name: "<green>Nobody is banned here"
    alone:
      name: "<gray>Nobody else is in your group"
    group:
      name: "<#ffc371><bold>{group}</bold>"
      lore: ["<gray>Players: <white>{members}", "<gray>Password: {password}", "<gray>Hidden: {hidden}", "<gray>Created by: <white>{owner}", "", "<#ffc371>Click to open"]
    prefer:
      name: "<#ffc371>When I join a group"
      lore: ["<gray>I join: <white>{value}", "", "<#ffc371>Click to switch"]
    member:
      owner: "<#ffc371>created this group"
      muted: "<red>muted"
      deaf: "<red>hears nothing"
      unseen: "<gray>unseen"
      actions: ["", "<#ffc371>Click for actions"]
    join:
      name: "<green><bold>Join</bold>"
      lore: ["<#ffc371>Left click: join {mode}", "<#ffc371>Right click: the other way"]
    visibility:
      name: "<#ffc371>I am: {value}"
      lore: ["<gray>Unseen: players do not see you", "<gray>in the group, but you can still", "<gray>talk and listen.", "", "<#ffc371>Click to switch"]
    password-set:
      name: "<#ffc371>Set a password"
      lore: ["<gray>Only players with the password", "<gray>can join then.", "", "<#ffc371>Click and type it"]
    password-change:
      name: "<#ffc371>Password"
      lore: ["<#ffc371>Click: new password", "<red>Shift + click: remove the password"]
    password-send:
      name: "<#ffc371>Show the password"
      lore: ["<gray>Sends it to your chat,", "<gray>click there to copy it."]
    password-unknown:
      name: "<gray>Password unknown"
      lore: ["<gray>A player set it. StaffCore only knows", "<gray>passwords set through this menu."]
    bans:
      name: "<#ffc371>Banned players"
      lore: ["<gray>Banned from this group: <white>{count}", "", "<#ffc371>Click to open"]
    close:
      name: "<red><bold>Close the group</bold>"
      lore: ["<gray>Everyone is removed from it.", "", "<red>Shift + click to close"]
    kick:
      name: "<#ffc371>Remove from the group"
    mute:
      name: "<red>Mute"
      lore: ["<gray>Nobody hears this player until", "<gray>you undo it or they leave the group."]
    unmute:
      name: "<green>Unmute"
    deafen:
      name: "<red>Hears nothing"
      lore: ["<gray>The player hears no voice chat until", "<gray>you undo it or they leave the group."]
    undeafen:
      name: "<green>May hear again"
    ban:
      name: "<red>Ban from the group"
      lore: ["<gray>The player is removed and", "<gray>cannot join this group again."]

  guide:
    title: "<dark_gray>Command guide"
    entry: "<#ffc371>{command}"

  spawn:
    title: "<dark_gray>Spawn"
    world-spawn: "world spawn"
    set:
      name: "<#ffc371>Set spawn here"
      lore: ["<gray>Now: <white>{value}", "", "<#ffc371>Click to use where you stand"]
    go:
      name: "<#ffc371>Go to spawn"
    enabled:
      name: "<#ffc371>/spawn"
      lore: ["{value}", "<gray>Switch off if another plugin", "<gray>already handles /spawn."]
    on-join:
      name: "<#ffc371>Send to spawn on join"
      lore: ["<gray>Now: <white>{value}", "", "<#ffc371>Click to switch"]
    on-death:
      name: "<#ffc371>Respawn at spawn"
      lore: ["{value}", "<gray>Players without a bed come", "<gray>back at spawn after dying."]
