# StaffCore - English texts
# Colors use the MiniMessage format: https://docs.advntr.dev/minimessage/format.html
# Words in {curly brackets} are filled in by the plugin - keep them as they are.

prefix: "<gradient:#ff5f6d:#ffc371><bold>StaffCore</bold></gradient> <dark_gray>»</dark_gray> "
none: "none"
no-reason: "No reason given"
no-limit: "no limit"
staff-team: "the server team"
online: "<green>online"
offline: "<gray>offline"
reloaded: "<green>Configuration reloaded."
language-set: "<green>Language set to <white>{language}</white>."

permanent: "permanent"
never: "never"
custom: "custom"
applied: "<gray><white>{player}</white>: offense no. <white>{n}</white> in <white>{category}</white> → <white>{punishment}"

type:
  MUTE: "Mute"
  IPBAN: "IP ban"
  SPECBAN: "Spectator ban"
  WARN: "Warning"
  PLAYBAN: "PlayBan"
  BAN: "Ban"

warn:
  title: "<yellow><bold>WARNING</bold></yellow>"
  subtitle: "<gray>{reason}"
  you: "<yellow>You were warned by the server team. Reason: <white>{reason}"
  broadcast: "<white>{staff}</white> <gray>warned</gray> <white>{player}</white><gray>. Reason:</gray> <white>{reason}"

ban:
  id-line: "<gray>Ban ID: <white>{id}"
  broadcast-spectator: "<white>{staff}</white> <gray>put</gray> <white>{player}</white> <gray>into a spectator ban. Duration:</gray> <white>{time}</white><gray>. Reason:</gray> <white>{reason}"
  discord-line: "<gray>Discord: <#ffc371>{discord}"
  screen: |-
    <gradient:#ff5f6d:#ffc371><bold>StaffCore</bold></gradient>

    <red>You are banned from this server.

    <gray>Reason: <white>{reason}
    <gray>Time left: <white>{time}
    <gray>Banned by: <white>{staff}
  broadcast: "<white>{staff}</white> <gray>banned</gray> <white>{player}</white><gray>. Duration:</gray> <white>{time}</white><gray>. Reason:</gray> <white>{reason}"
  broadcast-unbanned: "<white>{staff}</white> <gray>unbanned</gray> <white>{player}</white><gray>."

limbo:
  id: "<gray>Your ban ID: <white>{id}</white>. Appeal with <#ffc371>/appeal {id} <text></#ffc371>"
  title: "<red><bold>BANNED</bold></red>"
  subtitle: "<gray>Time left: <white>{time}"
  status: "<red>You are banned and can only watch. <gray>Time left: <white>{time}</white>. Reason: <white>{reason}"
  hint: "<gray>Want to appeal? Write <#ffc371>/ticket <your message></#ffc371>."
  discord: "<gray>Our Discord: <click:open_url:'{discord}'><#ffc371><underlined>{discord}</underlined></#ffc371></click>"
  bossbar: "<red><bold>BANNED</bold></red> <dark_gray>|</dark_gray> <white>{time}</white> <gray>left</gray> <dark_gray>|</dark_gray> <#ffc371>/ticket <message>"
  default-location: "world spawn"

profile:
  state:
    free: "<green>not punished"
    playban: "<gold>PlayBan running"
    banned: "<red>banned"

note:
  added: "<green>Note saved for <white>{player}</white>."

actionbar: "<gray>PlayBan <dark_gray>|</dark_gray> <white>{time}</white> <gray>left <dark_gray>|</dark_gray> <gray>Reason: <white>{reason}"

vanish:
  "on": "<gray>You are now <white>invisible</white>. Players cannot see you, and your chat goes to the team only. Start a message with <white>!</white> to write publicly. <#ffc371>/vanish</#ffc371> shows you again."
  actionbar: "<#ffc371><bold>VANISH</bold></#ffc371> <dark_gray>|</dark_gray> <gray>Only the team can see you"
  still: "<gray>You are still <white>invisible</white>. <#ffc371>/vanish</#ffc371> shows you again."
  death: "<white>{player}</white> died"
  chat: "<dark_gray>[<#ffc371>Vanish</#ffc371>]</dark_gray> <white>{player}</white><gray>:</gray> <white>{text}"
  "off": "<gray>You are <white>visible</white> again."

appeal:
  not-punished: "<gray>You are not punished, so there is nothing to appeal."
  usage: "<gray>Usage: <white>/appeal {id} <why you should be unbanned></white>"
  wrong-id: "<red>That ban ID does not belong to your punishment. Check your ban screen."
  too-short: "<red>Please explain a little more, at least 10 characters."
  ticket-text: "Appeal for ban {id}: {text}"
  received: "<green>Your appeal for ban <white>{id}</white> was received as ticket <white>#{ticket}</white>. The team will answer you."

inventory-mode:
  KEEP: "keep everything"
  STORE: "take away, give back at the end"
  CLEAR: "delete for good"

guide:
  mute: ["<gray>The player cannot chat or use /msg.", "<gray>Without a time it is permanent.", "", "<dark_gray>Example: /mute Steve 1h Spam"]
  ipban: ["<gray>Bans the player and the address", "<gray>they play from, so a second account", "<gray>does not help."]
  lockdown: ["<gray>Only the team can join, everyone", "<gray>else is kicked. Again to open.", "", "<dark_gray>Example: /lockdown on Maintenance"]
  mutechat: ["<gray>Only the team can write in chat.", "<gray>Again to open it."]
  slowchat: ["<gray>Players may only write every few", "<gray>seconds.", "", "<dark_gray>Example: /slowchat 5"]
  whois: ["<gray>Rank, first and last join, play time,", "<gray>punishments, notes, same address", "<gray>and where the player is right now."]
  alts: ["<gray>Accounts that joined from the", "<gray>same address."]
  stafflist: ["<gray>Which team members are online."]
  near: ["<gray>Players near you, with distance."]
  report: ["<gray>Report a player to the team.", "", "<dark_gray>Example: /report Steve destroyed my house"]
  blocklog: ["<gray>Who broke, placed or blew up which", "<gray>block, who took what from chests.", "<gray>Undo it or watch it as a replay.", "", "<dark_gray>Example: /bl near 10 2h"]
  staffmode: ["<gray>Stores your inventory and gives you", "<gray>every admin item. Again to leave."]
  tools: ["<gray>Opens the admin items: bannhammer,", "<gray>freeze wand, handcuffs, inspector,", "<gray>teleport compass, vanish cloak, x-ray."]
  tpadmin: ["<gray>Turns you invisible and takes you", "<gray>to a player. /tpback takes you back.", "", "<dark_gray>Example: /tpadmin Steve"]
  tphere: ["<gray>Brings a player to you."]
  freeze: ["<gray>Freezes a player in place: no moving,", "<gray>building or fighting. Again to undo.", "<gray>Logging out is reported."]
  invsee: ["<gray>Opens a player's inventory.", "<gray>/endersee opens the ender chest.", "<gray>Admins can also move items."]
  teamchat: ["<gray>Switches the team chat on or off.", "<gray>With a text it sends just that.", "", "<dark_gray>Example: /teamchat check spawn"]
  clearchat: ["<gray>Clears the chat for players.", "<gray>The team keeps it."]
  fly: ["<gray>Flying on or off. Admins can", "<gray>add a player name."]
  heal: ["<gray>Full health and food, removes", "<gray>bad effects and fire."]
  god: ["<gray>You take no damage and do", "<gray>not get hungry. Again to undo."]
  rank: ["<gray>Gives a player a rank.", "<gray>Only ranks below your own level.", "", "<dark_gray>Example: /rank set Steve mod"]
  rank-setup: ["<gray>Makes you owner, once, while", "<gray>nobody has the highest rank.", "<gray>After that the command levels apply."]
  spawn: ["<gray>Teleports you to spawn.", "<gray>Stand still for the countdown."]
  setspawn: ["<gray>Sets the spawn where you stand."]
  menu: ["<gray>Opens the main menu.", "<gray>Everything else starts here."]
  punish: ["<gray>Pick a category for a player.", "<gray>StaffCore works out the punishment", "<gray>from their earlier offenses.", "", "<dark_gray>Example: /punish Steve"]
  apply: ["<gray>Same as /punish, but without a menu.", "<gray>Works from the console too.", "", "<dark_gray>Example: /sc apply Steve x-ray"]
  ban: ["<gray>A real ban: the player cannot join.", "<gray>Use perm for a permanent ban.", "", "<dark_gray>Example: /ban Steve 7d Hacking"]
  specban: ["<gray>The player may join, but is stuck", "<gray>as a spectator and can only write", "<gray>tickets or an appeal."]
  warn: ["<gray>A warning. Counts as an offense", "<gray>for the categories.", "", "<dark_gray>Example: /warn Steve Spam"]
  unban: ["<gray>Lifts a ban. Works with the name", "<gray>or with the ban ID.", "", "<dark_gray>Example: /unban K7QX2M"]
  pardon: ["<gray>Ends a running PlayBan at once."]
  time: ["<gray>Makes a PlayBan longer or shorter.", "", "<dark_gray>Example: /sc addtime Steve 1h"]
  note: ["<gray>Writes a note about a player.", "<gray>Only the team sees it."]
  profile: ["<gray>Notes, punishments and tickets", "<gray>of one player."]
  vanish: ["<gray>Makes you invisible to players.", "<gray>The team still sees you."]
  ticket-show: ["<gray>All tickets, with filters.", "", "<dark_gray>Example: /ticket show report"]
  voice: ["<gray>Moderate voice groups.", "<gray>Needs Simple Voice Chat."]
  ticket: ["<gray>Write to the server team:", "<gray>report a player, ask something,", "<gray>report a bug."]
  appeal: ["<gray>Ask to be unbanned. You need", "<gray>the ban ID from your ban screen."]
  tasks: ["<gray>When you are punished: shows", "<gray>time left, the reason and the", "<gray>tasks that shorten your time."]

spawn:
  disabled: "<red>/spawn is switched off on this server."
  warmup: "<gray>Teleporting to spawn in <white>{seconds}</white> seconds. Do not move."
  countdown: "<#ffc371>Spawn in <white>{seconds}</white>..."
  done: "<green>Welcome to spawn."
  moved: "<red>You moved, so the teleport was cancelled."
  hurt: "<red>You took damage, so the teleport was cancelled."
  cooldown: "<red>You can use /spawn again in <white>{time}</white>."
  set: "<green>Spawn set to <white>{world} {x} {y} {z}</white>."
  sent: "<gray>Sent <white>{player}</white> to spawn."
  sent-you: "<gray><white>{staff}</white> sent you to spawn."
  join-mode:
    NEVER: "never"
    FIRST_JOIN: "only new players"
    ALWAYS: "every time"

help: |-
  <gradient:#ff5f6d:#ffc371><bold>StaffCore</bold></gradient> <gray>- commands
  <#ffc371>/sc menu <dark_gray>-</dark_gray> <gray>open the main menu
  <#ffc371>/sc <player> <dark_gray>-</dark_gray> <gray>pick a category for a player
  <#ffc371>/sc apply <player> <category> <dark_gray>-</dark_gray> <gray>punish by category
  <#ffc371>/sc warn <player> [reason] <dark_gray>-</dark_gray> <gray>warn a player
  <#ffc371>/sc ban <player> <time|perm> [reason] <dark_gray>-</dark_gray> <gray>real ban
  <#ffc371>/sc unban <player> <dark_gray>-</dark_gray> <gray>lift a ban
  <#ffc371>/sc specban <player> <time|perm> [reason] <dark_gray>-</dark_gray> <gray>spectator ban
  <#ffc371>/sc note <player> <text> <dark_gray>-</dark_gray> <gray>write a note about a player
  <#ffc371>/sc profile <player> <dark_gray>-</dark_gray> <gray>notes and punishments of a player
  <#ffc371>/sc punish <player> <time> [reason] <dark_gray>-</dark_gray> <gray>punish a player
  <#ffc371>/sc pardon <player> <dark_gray>-</dark_gray> <gray>end a punishment
  <#ffc371>/sc addtime <player> <time> <dark_gray>-</dark_gray> <gray>make it longer
  <#ffc371>/sc removetime <player> <time> <dark_gray>-</dark_gray> <gray>make it shorter
  <#ffc371>/sc info <player> <dark_gray>-</dark_gray> <gray>show a punishment
  <#ffc371>/sc list <dark_gray>-</dark_gray> <gray>all punished players
  <#ffc371>/sc history <player> <dark_gray>-</dark_gray> <gray>earlier punishments
  <#ffc371>/sc lang <code> <dark_gray>-</dark_gray> <gray>change the language
  <#ffc371>/sc reload <dark_gray>-</dark_gray> <gray>reload the files
  <#ffc371>/ticket show [reason] <dark_gray>-</dark_gray> <gray>ticket overview
  <#ffc371>/ticket open <number> <dark_gray>-</dark_gray> <gray>open one ticket
  <#ffc371>/ticket stats <dark_gray>-</dark_gray> <gray>team statistics
  <#ffc371>/ticket back <dark_gray>-</dark_gray> <gray>return after a ticket teleport
  <#ffc371>/voice <dark_gray>-</dark_gray> <gray>voice groups (needs Simple Voice Chat)
  <gray>Short forms: <#ffc371>/ban</#ffc371>, <#ffc371>/tempban</#ffc371>, <#ffc371>/punish</#ffc371>, <#ffc371>/warn</#ffc371>, <#ffc371>/unban</#ffc371>, <#ffc371>/vanish</#ffc371>
  <#ffc371>/spawn</#ffc371> <dark_gray>-</dark_gray> <gray>to spawn, <#ffc371>/setspawn</#ffc371> <dark_gray>-</dark_gray> <gray>set it
  <#ffc371>/guide</#ffc371> <dark_gray>-</dark_gray> <gray>every command with an example, as a menu
  <gray>Times look like <white>30m</white>, <white>2h</white>, <white>1d 12h</white>.

usage:
  mute: "<gray>Usage: <white>/mute <player> [time|perm] [reason]"
  unmute: "<gray>Usage: <white>/unmute <player>"
  ipban: "<gray>Usage: <white>/ipban <player> <time|perm> [reason]"
  specban: "<gray>Usage: <white>/sc specban <player> <time|perm> [reason]"
  note: "<gray>Usage: <white>/sc note <player> <text>"
  profile: "<gray>Usage: <white>/sc profile <player>"
  apply: "<gray>Usage: <white>/sc apply <player> <category>"
  warn: "<gray>Usage: <white>/sc warn <player> [reason]"
  ban: "<gray>Usage: <white>/sc ban <player> <time|perm> [reason]"
  unban: "<gray>Usage: <white>/sc unban <player>"
  punish: "<gray>Usage: <white>/punish <player></white>, <white>/punish <player> <category></white> or <white>/punish <player> <time> [reason]"
  pardon: "<gray>Usage: <white>/sc pardon <player>"
  addtime: "<gray>Usage: <white>/sc addtime <player> <time>"
  removetime: "<gray>Usage: <white>/sc removetime <player> <time>"
  info: "<gray>Usage: <white>/sc info <player>"
  history: "<gray>Usage: <white>/sc history <player>"
  lang: "<gray>Usage: <white>/sc lang <code></white> - available: <white>{list}"
  ticket: "<gray>Usage: <white>/ticket <your message>"

error:
  no-address: "<red>No address is known for <white>{player}</white> yet. They have to join once."
  already-muted: "<red><white>{player}</white> is already muted."
  not-muted: "<red><white>{player}</white> is not muted."
  unknown-command: "<red>Unknown command. Type <white>/guide</white> for the commands you can use."
  short-commands-off: "<red>Short commands are switched off. Use <white>/sc {command}</white>."
  bad-link: "<red>That is not a valid link. It has to start with <white>https://</white>."
  already-banned: "<red><white>{player}</white> is already banned."
  not-banned: "<red><white>{player}</white> is not banned."
  unknown-category: "<red>There is no category <white>{category}</white>, or it has no steps."
  bad-duration: "<red>A PlayBan needs a duration."
  no-permission: "<red>You are not allowed to do that."
  players-only: "<red>Only players can use this."
  unknown-player: "<red>The player <white>{player}</white> was never on this server."
  already-punished: "<red><white>{player}</white> is already punished."
  not-punished: "<red><white>{player}</white> is not punished."
  not-punished-self: "<gray>You are not punished. Nothing to see here."
  exempt: "<red><white>{player}</white> cannot be punished."
  bad-time: "<red><white>{input}</white> is not a time. Examples: <white>30m</white>, <white>2h</white>, <white>1d 12h</white>."
  bad-number: "<red><white>{input}</white> is not a valid number."
  bad-reduction: "<red><white>{input}</white> is not valid. Use a time like <white>30m</white> or a share like <white>10%</white>."
  bad-answers: "<red>A question needs at least two answers, separated by <white>|</white>."
  hold-item: "<red>Hold the item you want in your main hand, then click again."
  no-history: "<gray>No punishments found for <white>{player}</white>."

punish:
  title: "<gradient:#ff5f6d:#ffc371><bold>PLAYBAN</bold></gradient>"
  subtitle: "<gray>You are restricted for <white>{time}</white>"
  broadcast: "<white>{staff}</white> <gray>punished</gray> <white>{player}</white> <gray>for</gray> <white>{time}</white><gray>. Reason:</gray> <white>{reason}"

end:
  title: "<green><bold>FREE AGAIN</bold></green>"
  subtitle: "<gray>Your punishment is over. Play fair."
  served: "<green>Your punishment is over. Welcome back!"
  pardoned: "<green>The server team ended your punishment early."
  broadcast-served: "<gray>The punishment of <white>{player}</white> is over."
  broadcast-pardoned: "<white>{staff}</white> <gray>ended the punishment of</gray> <white>{player}</white><gray>."

status:
  id: "<gray>Ban ID: <white>{id}</white> <dark_gray>(for /appeal)"
  line: "<gray>You are punished for another <white>{time}</white>. Reason: <white>{reason}"
  online-only: "<gray>The time only runs while you are <white>online</white>."
  real-time: "<gray>The time also runs while you are offline."
  hint: "<gray>Use <#ffc371>/playban</#ffc371> to see tasks that shorten your time."
  OPEN: "<yellow>● Open"
  PENDING: "<gold>● Waiting for the team"
  DONE: "<green>✔ Done"
  EXPIRED: "<red>✘ Too late"

mode:
  online: "only while online"
  real: "real time"

bossbar: "<gradient:#ff5f6d:#ffc371><bold>PlayBan</bold></gradient> <dark_gray>|</dark_gray> <white>{time}</white> <gray>left</gray> <dark_gray>|</dark_gray> <gray>Tasks</gray> <white>{done}/{total}</white> <dark_gray>|</dark_gray> <#ffc371>/playban"

blocked:
  action: "<red>You cannot do that while you are punished."
  chat: "<red>You cannot chat while you are punished. Use <white>/ticket <message></white> to reach the team."
  command: "<red>This command is locked while you are punished."

time:
  added-you: "<red>Your punishment was extended by <white>{time}</white>."
  removed-you: "<green>Your punishment was shortened by <white>{time}</white>."
  changed: "<gray><white>{player}</white> now has <white>{time}</white> left."

info:
  line: "<white>{player}</white> <dark_gray>|</dark_gray> <gray>left:</gray> <white>{time}</white> <dark_gray>|</dark_gray> <gray>reason:</gray> <white>{reason}</white> <dark_gray>|</dark_gray> <gray>by:</gray> <white>{staff}</white> <dark_gray>|</dark_gray> <gray>tasks:</gray> <white>{done}/{total}"

list:
  empty: "<gray>Nobody is punished right now."
  header: "<gray>Punished players: <white>{count}"
  entry: " <dark_gray>-</dark_gray> <white>{player}</white> <dark_gray>|</dark_gray> <white>{time}</white> <dark_gray>|</dark_gray> <gray>{reason}"

history:
  WARNED: "<yellow>warning"
  running: "<red>still running"
  SERVED: "<green>served"
  PARDONED: "<yellow>ended early by the team"

staff:
  same-address: "<yellow><white>{player}</white> joined from the same address as the punished player <white>{other}</white>."
  pending: "<gray>Waiting for the team: <white>{reviews}</white> messages to check, <white>{tickets}</white> tickets. <#ffc371>/sc menu"

review:
  submitted: "<green>Your message was sent to the team. The task counts once they approve it."
  new: "<gray><white>{player}</white> wrote a message that needs a check. <#ffc371>/sc menu"
  approved: "<green>Message from <white>{player}</white> approved."
  rejected: "<gray>Message from <white>{player}</white> rejected."
  rejected-you: "<red>The team rejected your message. You can try the task again."
  delivered: "<gray>A message for you from <white>{player}</white>:</gray> <white>{text}"

voice:
  "yes": "<green>yes"
  "no": "<gray>no"
  seen: "visible"
  unseen: "unseen"
  not-installed: "<red>This server has no voice chat. StaffCore needs the plugin <white>Simple Voice Chat</white> for this."
  failed: "<red>The voice chat refused that. Look at the server log for details."
  bad-password: "<red>A password has no spaces and at most 64 characters."
  not-owner: "<red>You can only manage a voice group you created and are in."
  kicked-you: "<red><white>{staff}</white> removed you from the voice group."
  banned-you: "<red><white>{staff}</white> banned you from the voice group."
  closed-you: "<gray>The voice group <white>{group}</white> was closed by <white>{staff}</white>."
  muted-you: "<red>Your microphone was muted by <white>{staff}</white>."
  unmuted-you: "<green>Your microphone is free again."
  deafened-you: "<red>You cannot hear the voice chat for now. Set by <white>{staff}</white>."
  undeafened-you: "<green>You can hear the voice chat again."
  password: "<gray>Password of <white>{group}</white>:</gray> <#ffc371>{password}</#ffc371> <dark_gray>[click to copy]"
  pulled-in: "<red><white>{staff}</white> put you into a voice group. You are muted. <#ffc371><underlined>Click here to speak.</underlined>"
  speaking: "<green>Your microphone is on. You can speak now."
  nothing-to-agree: "<gray>There is nothing to switch on right now."
  report-text: "Voice group \"{group}\": {reason}. In the group: {members}"
  help: |-
    <gradient:#ff5f6d:#ffc371><bold>StaffCore</bold></gradient> <gray>- voice chat
    <#ffc371>/voice report <dark_gray>-</dark_gray> <gray>report a voice group
    <#ffc371>/voice manage <dark_gray>-</dark_gray> <gray>kick or ban in your own group

rank:
  too-low: "<red>Your rank is too low for this command. It needs level <white>{level}</white>."
  setup-console: "<gray>Run <white>/rank set <player> owner</white> from the console, or <white>/rank setup</white> in-game as an op."
  setup-done-already: "<red>There is already an owner. Ask them for a rank."
  setup-needs-op: "<red>Only an op can claim the first owner rank."
  setup-ok: "<green>You are now <white>{rank}</white>. Command levels are active from now on, also for ops."
  list-entry: "<dark_gray>[{level}]</dark_gray> <gray>{members} players</gray> "
  info: "<white>{player}</white> <gray>has the rank</gray> <white>{rank}</white> <dark_gray>(level {level})"
  usage: "<gray>Usage: <white>/rank set <player> <rank></white>, <white>/rank remove <player></white>, <white>/rank info <player></white>, <white>/rank list</white>, <white>/rank setup</white>"
  unknown: "<red>There is no rank <white>{rank}</white>."
  not-allowed: "<red>You can only change ranks below your own level."
  set: "<green><white>{player}</white> is now <white>{rank}</white>."
  set-you: "<green>Your rank is now <white>{rank}</white>."

log:
  not-ready: "<red>The block log is not ready. Look at the server log."
  usage: "<gray>Usage: <white>/blocklog near [radius] [time]</white>, <white>/blocklog player <name> [time]</white>, <white>/blocklog rollback <name> [time] [radius]</white>, <white>/blocklog replay [radius] [time] [name]</white>"
  help: |-
    <gradient:#ff5f6d:#ffc371><bold>StaffCore</bold></gradient> <gray>- block log
    <#ffc371>/blocklog near [radius] [time]</#ffc371> <dark_gray>-</dark_gray> <gray>changes around you
    <#ffc371>/blocklog player <name> [time]</#ffc371> <dark_gray>-</dark_gray> <gray>everything one player did
    <#ffc371>/blocklog rollback <name> [time] [radius]</#ffc371> <dark_gray>-</dark_gray> <gray>undo it
    <#ffc371>/blocklog restore <name> [time] [radius]</#ffc371> <dark_gray>-</dark_gray> <gray>redo it
    <#ffc371>/blocklog replay [radius] [time] [name]</#ffc371> <dark_gray>-</dark_gray> <gray>watch it happen again
    <gray>The brush from <#ffc371>/tools</#ffc371> shows the history of one block. Examples: <white>/bl near 10 2h</white>, <white>/bl rollback Steve 1d 30</white>
  nothing: "<gray>Nothing found there."
  header: "<gray>Changes: <white>{count}</white> <dark_gray>(page {page}/{pages}, newest first)"
  at: "<gray>History of <white>{x} {y} {z}</white>:"
  more: "<#ffc371>[next page {next}]"
  line: "<dark_gray>{ago} ago</dark_gray> <white>{player}</white> <gray>{action}</gray> <white>{what}</white> <dark_gray>({x} {y} {z})"
  line-rolled: "<dark_gray><st>{ago} ago {player} {action} {what}</st> (undone)"
  hover: "<gray>World {world}. Click to go there."
  rolled-back: "<green>Undone: <white>{count}</white> changes."
  restored: "<green>Redone: <white>{count}</white> changes."
  replay-start: "<gray>Replay of <white>{count}</white> changes. Only you see it."
  replay-end: "<gray>The replay is at the end. <#ffc371>/blocklog stop</#ffc371> shows the real world again."
