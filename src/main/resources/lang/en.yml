    name: "<gray>« Back"
  prev:
    name: "<gray>« Previous page"
  next:
    name: "<gray>Next page »"
  page: "<gray>Page <white>{page}</white> of <white>{pages}"
  text-line: "<white>{text}"

  main:
    title: "<gradient:#ff5f6d:#ffc371><bold>StaffCore</bold></gradient>"
