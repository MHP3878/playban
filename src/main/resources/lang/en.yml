      name: "<#ffc371>Command levels"
      lore: ["<gray>Rules: <white>{count}", "<gray>Status: {state}", "<gray>Which command needs which level.", "<gray>Also holds for ops.", "", "<#ffc371>Click to edit"]
    new:
      name: "<green>New rank"
      lore: ["<gray>Click and type the name."]
    setup:
      name: "<gold><bold>Become owner</bold>"
      lore: ["<gray>Nobody has the highest rank yet.", "<gray>Click to claim it. After that the", "<gray>command levels are active."]

  rank-edit:
    title: "<dark_gray>Rank: {rank}"
    preview: ["<gray>Level: <white>{level}"]
    name:
      name: "<#ffc371>Name"
      lore: ["<gray>Now: <white>{value}", "", "<#ffc371>Click to change"]
    prefix:
      name: "<#ffc371>Prefix"
      lore: ["<gray>Now: <white>{value}", "<gray>Shown in chat and in the tab list.", "", "<#ffc371>Click to change"]
    level:
      name: "<#ffc371>Level"
      lore: ["<gray>Now: <white>{value}", "<gray>Higher means more power.", "", "<#ffc371>Click to change"]
    permissions:
      name: "<#ffc371>Permissions"
      lore: ["<gray>Given: <white>{count}", "", "<#ffc371>Click to edit"]
    members:
      name: "<#ffc371>Players"
      lore: ["<gray>With this rank: <white>{count}", "", "<#ffc371>Click to open"]
    delete:
      name: "<red>Delete rank"
      lore: ["<gray>Its players get the default rank.", "", "<red>Shift + click to delete"]

  rank-perms:
    title: "<dark_gray>Permissions: {rank}"
    entry: "<white>{node}"
    add:
      name: "<green>Add a permission"
      lore: ["<gray>For permissions of other plugins.", "<gray>Click and type it."]

