      name: "<#ffc371>Countdown"
      lore: ["<gray>Now: <white>{value}</white> seconds", "<gray>Standing still is needed, moving", "<gray>or damage cancels it.", "", "<#ffc371>Click to switch: 0, 3, 5, 10"]

  ranks:
    title: "<dark_gray>Ranks"
    active: "<green>active"
    inactive: "<red>not active yet: nobody is owner"
    entry:
      lore: ["<gray>Level: <white>{level}", "<gray>Players: <white>{members}", "<gray>Permissions: <white>{permissions}", "", "<#ffc371>Click to edit"]
      locked: ["", "<red>At or above your level, so locked"]
