name: StaffCore
version: '${project.version}'
main: dev.staffcore.StaffCorePlugin
api-version: '1.21'
description: Staff tools in one plugin - PlayBans, bans, categories, tickets, vanish, spawn and voice moderation.
softdepend: [Vault, voicechat]

commands:
  staffcore:
    description: StaffCore main command
    aliases: [sc, playban, pb]
  ticket:
    description: Open a ticket for the server team
    aliases: [scticket]

  appeal:
    description: Ask to be unbanned, with the ban ID from your ban screen
  voice:
    description: Voice group moderation (needs the plugin Simple Voice Chat)
    aliases: [scvoice]

permissions:
  staffcore.admin:
    description: Full access including settings and the task editor
    default: op
    children:
      staffcore.staff: true
      staffcore.invsee.edit: true
      staffcore.fly: true
      staffcore.heal: true
      staffcore.god: true
      staffcore.tool.banhammer: true
      staffcore.tool.xray: true
      staffcore.blocklog.rollback: true
      staffcore.ipban: true
      staffcore.lockdown: true
      staffcore.troll: true
      staffcore.modblock: true
      staffcore.announce: true
      staffcore.eco: true
      staffcore.homes.unlimited: true
  staffcore.staff:
    description: Punish players, handle reviews and tickets
    default: op
    children:
      staffcore.see: true
      staffcore.notify: true
      staffcore.voice: true
      staffcore.vanish: true
      staffcore.commands.all: true
      staffcore.spawn.instant: true
      staffcore.spawn.others: true
      staffcore.tpadmin: true
      staffcore.freeze: true
      staffcore.invsee: true
      staffcore.teamchat: true
      staffcore.clearchat: true
      staffcore.tools: true
      staffcore.tool.freeze: true
      staffcore.tool.handcuffs: true
      staffcore.tool.inspector: true
      staffcore.tool.compass: true
      staffcore.tool.vanish: true
      staffcore.tool.warnstick: true
      staffcore.tool.brush: true
      staffcore.tool.invsee: true
      staffcore.tool.randomtp: true
      staffcore.tool.fly: true
      staffcore.staffmode: true
      staffcore.blocklog: true
      staffcore.chatcontrol: true
      staffcore.prison: true
      staffcore.stafflog: true
      staffcore.tool.kbstick: true
      staffcore.tool.spectate: true
      staffcore.tool.bait: true
      staffcore.fakebase: true
      staffcore.esp: true
      staffcore.panel: true
      staffcore.ghost: true
      staffcore.anticheat: true
      staffcore.check: true
      staffcore.lag: true
      staffcore.money.others: true
  staffcore.see:
    description: Can still see punished players
    default: op
  staffcore.notify:
    description: Receives staff notifications
    default: op
  staffcore.vanish:
    description: Can turn invisible with /vanish and still sees vanished staff
    default: op
  staffcore.commands.all:
    description: Sees and can use commands that are hidden from normal players
    default: op
  staffcore.voice:
    description: Can moderate voice groups - kick, mute, ban, close, passwords, join unseen
    default: op
  staffcore.spawn:
    description: Can use /spawn
    default: true
  staffcore.spawn.instant:
    description: /spawn without countdown and cooldown
    default: op
  staffcore.spawn.others:
    description: Can send other players to spawn with /spawn <player>
    default: op
  staffcore.tpadmin:
    description: /tpadmin, /tphere and /tpback
    default: op
  staffcore.freeze:
    description: /freeze and /unfreeze
    default: op
  staffcore.invsee:
    description: Look into inventories and ender chests
    default: op
  staffcore.invsee.edit:
    description: Also take items out of them or put items in
    default: op
  staffcore.teamchat:
    description: Read and write the team chat
    default: op
  staffcore.clearchat:
    description: /clearchat
    default: op
  staffcore.fly:
    description: /fly
    default: op
  staffcore.heal:
    description: /heal
    default: op
  staffcore.god:
    description: /god
    default: op
  staffcore.tools:
    description: "/tools: the menu with the admin items"
    default: op
  staffcore.tool.banhammer:
    description: "Bannhammer: a hit opens the punish menu"
    default: op
  staffcore.tool.freeze:
    description: "Freeze wand: freezes the player you aim at"
    default: op
  staffcore.tool.handcuffs:
    description: "Handcuffs: lead a player behind you"
    default: op
  staffcore.tool.inspector:
    description: "Inspector: a click shows a player's profile"
    default: op
  staffcore.tool.compass:
    description: "Teleport compass: jump to any player, invisible"
    default: op
  staffcore.tool.vanish:
    description: "Vanish cloak: turn invisible with a click"
    default: op
  staffcore.tool.xray:
    description: "X-ray glasses: ores nearby glow through walls, only for you"
    default: op
  staffcore.tool.warnstick:
    description: "Warn stick - a hit warns, right-click takes the newest warning back"
    default: op
  staffcore.tool.brush:
    description: "Block-log brush - click a block or chest to see who changed it"
    default: op
  staffcore.tool.invsee:
    description: "Inventory chest - right-click a player to look into their inventory"
    default: op
  staffcore.tool.randomtp:
    description: "Random teleport - jump to a random player, invisible"
    default: op
  staffcore.tool.fly:
    description: "Fly feather - flying on or off"
    default: op
  staffcore.staffmode:
    description: "/staffmode - swap your inventory for the admin items"
    default: op
  staffcore.blocklog:
    description: "/blocklog - look up who changed blocks and chests, and replay it"
    default: op
  staffcore.blocklog.rollback:
    description: "/blocklog rollback and restore"
    default: op
  staffcore.chatcontrol:
    description: "/mutechat and /slowchat"
    default: op
  staffcore.ipban:
    description: "/ipban - ban a player and the address they play from"
    default: op
  staffcore.lockdown:
    description: "/lockdown - only the team may join"
    default: op
  staffcore.prison:
    description: "/prison and /unprison - wall a player into a bedrock cell, prison key"
    default: op
  staffcore.troll:
    description: "/troll - harmless jokes like chicken rain or a fake stash, troll wand"
    default: op
  staffcore.panel:
    description: "/admin - your admin panel with inbox, admin mode, ghost mode and your commands"
    default: op
  staffcore.ghost:
    description: "Ghost mode - creative, invisible, and through walls like a spectator"
    default: op
  staffcore.anticheat:
    description: "Sees anti-cheat alerts and marked players, /anticheat"
    default: op
  staffcore.check:
    description: "/check - everything about a player on one live page"
    default: op
  staffcore.lag:
    description: "/lag and /cleanup"
    default: op
  staffcore.announce:
    description: "/announce - a message with a title to everybody"
    default: op
  staffcore.totem:
    description: "/totem - put a totem from the inventory into the off hand"
    default: true
  staffcore.modblock:
    description: "/modblock and /modunblock - forbid mods by name"
    default: op
  staffcore.modguard.bypass:
    description: Not checked for forbidden clients and mods
    default: false
  staffcore.anticheat.bypass:
    description: Never checked by the anti-cheat (not even ops have it by default)
    default: false
  staffcore.esp:
    description: "/esp and the ESP spyglass - chests glow and players have name tags through walls, only for you"
    default: op
  staffcore.home:
    description: "/home, /sethome, /delhome, /homes"
    default: true
  staffcore.homes.unlimited:
    description: As many homes as you like
    default: op
  staffcore.tpa:
    description: "/tpa, /tpahere, /tpaccept, /tpdeny, /tpacancel"
    default: true
  staffcore.money:
    description: "/money and /baltop"
    default: true
  staffcore.pay:
    description: "/pay - give money to other players"
    default: true
  staffcore.money.others:
    description: "/money <player> - look at other players' money"
    default: op
  staffcore.eco:
    description: "/eco give, take, set - change anybody's money"
    default: op
  staffcore.fakebase:
    description: "/fakebase - a bait base deep underground with chests and two fake players; catches ESP and x-ray"
    default: op
  staffcore.fakebase:
    description: "/fakebase - a bait base deep underground with chests and two fake players; catches ESP and x-ray"
    default: op
  staffcore.stafflog:
    description: "/stafflog - the team protocol: who punished, jailed or trolled whom, and which commands the team typed"
    default: op
  staffcore.tool.kbstick:
    description: "Knockback stick - pushes a player like a hit without damage and shows how far they moved (anti-knockback check)"
    default: op
  staffcore.tool.spectate:
    description: "Spectate eye - look through a player's eyes, sneak to come back"
    default: op
  staffcore.tool.bait:
    description: "Bait chest - mark a chest; the team is told when a player opens it"
    default: op
  staffcore.ranks:
    description: Can open /rank and give ranks below their own level
    default: op
  staffcore.ticket:
    description: Can open tickets
    default: true
  staffcore.teleport:
    description: Can teleport to players from a ticket and pick a game mode for it
    default: op
  staffcore.exempt:
    description: Cannot be punished by other players (the console still can)
    default: op
  staffcore.exempt.bypass:
    description: Can punish players who have staffcore.exempt
    default: false
